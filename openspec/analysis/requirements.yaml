# phase: 對應計畫書 §11 Phase 1-5；mvp 表示屬 §15 第一版範圍

functional:
  - id: FR-001
    title: Google 登入
    description: 系統 SHALL 允許使用者以 Google 帳號登入，使儲存的測驗紀錄與報告歸屬於該帳號；MUST NOT 要求登入才能完成測驗與查看固定報告。
    priority: must
    phase: 1
    mvp: true
    context: [CTX-ACTOR-001, CTX-EXT-006, CTX-ASM-004]
    source: "plan §11 Phase 1, §15；user 補充（Google login）"
  - id: FR-032
    title: 訪客使用與登入後儲存
    description: 系統 SHALL 允許未登入訪客完成測驗並查看結果；訪客當次結果 SHALL 以 session id 暫存於 Firestore，TTL 為 1 天，且 MUST NOT 與任何帳號關聯或永久保存；訪客當次選擇登入時，SHALL 依 session id 將暫存結果存入其帳號；app 內 MUST 明確提示「未登入將不保留結果」並引導 Google 登入。已登入使用者的結果 SHALL 保留。使用點數（取得 summary 或詳細分析）前 MUST 已登入。
    priority: must
    phase: 1
    mvp: true
    context: [CTX-ACTOR-001, CTX-EXT-006, CTX-EXT-005, CTX-ASM-004, CTX-ASM-008]
    source: "user 補充（Google login 以儲存資料；訪客結果以 session id 暫存 Firestore，TTL 1 天）"
  - id: FR-002
    title: 生日、星座與選填血型／MBTI／出生時間地點
    description: 系統 SHALL 要求使用者提供生日與星座（皆必填，星座可由生日帶入）；血型（A/B/O/AB/不知道）、MBTI、出生時間與出生地點為選填（出生地點從預設城市清單選擇，含經緯度與時區）。血型選「不知道」時 MUST 不計入分析。
    priority: must
    phase: 1
    mvp: true
    context: [CTX-ACTOR-001, CTX-ASM-005, CTX-ASM-006, CTX-CON-006]
    source: "plan §3.1；user 補充"
    note: "生日需儲存，影響資料最小化；未填出生時間或地點則無法產生人類圖（FR-036）"
  - id: FR-003
    title: 測驗清單與題目取得
    description: 系統 SHALL 提供可用測驗清單，並依測驗 ID 回傳含版本的題目與選項。
    priority: must
    phase: 1
    mvp: true
    context: [CTX-ACTOR-001]
    source: "plan §8, §10"
  - id: FR-004
    title: 16 型人格（MBTI）測驗作答與評分（選填）
    description: 系統 SHALL 允許使用者（含未登入訪客）選擇完成 16 型人格（MBTI）測驗（對外名稱用「16 型人格」、題目自行撰寫，見 CTX-CON-015），並 MUST 由後端依評分規則計算 16 型結果；此計算與 summary 內容皆為事先定義，MUST NOT 呼叫 AI、不消耗 token。
    priority: must
    phase: 1
    mvp: true
    context: [CTX-ACTOR-001, CTX-CON-001, CTX-CON-007, CTX-ASM-008]
    source: "plan §3.1, §8, §11 Phase 1；user 補充"
  - id: FR-005
    title: 測驗紀錄保存
    description: 系統 SHALL 在使用者已登入時，將每次測驗的版本、起訖時間、分數、結果與每題作答保存至 Firebase，並允許使用者查看自己的測驗歷史；測驗結果保存 3 個月（見 FR-033）。
    priority: must
    phase: 2
    mvp: true
    context: [CTX-ACTOR-001, CTX-ACTOR-002, CTX-CON-006, CTX-EXT-005, CTX-EXT-006]
    source: "plan §7, §11 Phase 2, §15；user 補充"
    note: "保存每題作答（AI 引用依據所需）；作答時間僅在已告知時蒐集；詳細分析的輸入快照只存摘要（user 採納建議）"
