  - id: FR-057
    title: 自我分析的伺服器端驗證與計分
    description: 系統 MUST 在伺服器端驗證自我分析的作答並計分，MUST NOT 信任前端的分數；量表題 MUST 每題恰好一次、值在量表範圍內、不含未知題目；挑選題 MUST 只含清單內項目、數量符合規定、不重複；不合法 MUST 回傳 400 並指出問題；計分 MUST 為固定規則的純函式、不呼叫 AI。
    priority: must
    phase: 7
    mvp: false
    context: [CTX-CON-021, CTX-CON-003, CTX-CON-007]
    source: "openspec/changes/expand-self-analysis-dimensions/specs/self-assessment-framework/spec.md"
  - id: FR-058
    title: 自我分析的固定內容 ASSESSMENT
    description: 系統 SHALL 以固定內容類型 ASSESSMENT 儲存各分析的結果文字，金鑰以分析識別碼開頭、合法金鑰由登錄表決定；內容 MUST 事先撰寫、不呼叫 AI；計分後需要顯示的內容尚未發佈時 MUST 回 404 且不保存結果；固定內容覆蓋檢查 MUST 納入所有已登錄分析的金鑰。
    priority: must
    phase: 7
    mvp: false
    context: [CTX-CON-021, CTX-CON-007, CTX-CON-005]
    source: "openspec/changes/expand-self-analysis-dimensions/specs/self-assessment-framework/spec.md"
  - id: FR-059
    title: 自我分析結果的保存、到期與刪除
    description: 系統 SHALL 在已登入使用者完成自我分析時，於 users/{uid}/assessmentAttempts 新增一筆紀錄（分析識別碼、版本、作答、結果、完成時間、到期時間）並保存 3 個月、到期後自動清除、刪除帳號與刪除測驗結果時一併刪除；訪客完成時 MUST NOT 寫入任何文件，結果只留在瀏覽器當次 session，登入後 SHALL 可選擇儲存。
    priority: must
    phase: 7
    mvp: false
    context: [CTX-CON-023, CTX-CON-012, CTX-EXT-005, CTX-ACTOR-001]
    source: "openspec/changes/expand-self-analysis-dimensions/specs/self-assessment-framework/spec.md"
  - id: FR-060
    title: 通用的測驗頁與結果頁
    description: 系統 SHALL 提供 /assessment/{id} 測驗頁（量表題：分頁、進度、已作答與未作答的區別、全部作答後才可送出、作答暫存於 sessionStorage；挑選題：挑選與排序）與 /analysis/{id} 結果頁（固定顯示「怎麼看這份結果」說明與免責聲明，以及該分析自己的結果區塊）。
    priority: must
    phase: 7
    mvp: false
    context: [CTX-CON-021, CTX-CON-024, CTX-ACTOR-001]
    source: "openspec/changes/expand-self-analysis-dimensions/specs/self-assessment-framework/spec.md"
  - id: FR-061
    title: 自我分析的入口與旗標
    description: 系統 SHALL 依登錄表在首頁與 /self-reports 為每個分析顯示卡片，每個分析各有入口旗標；旗標關閉時卡片 MUST NOT 出現，頁面本身仍可由網址進入；已有未到期結果時卡片亮起並連到結果頁。
    priority: should
    phase: 7
    mvp: false
    context: [CTX-CON-021, CTX-ACTOR-001]
    source: "openspec/changes/expand-self-analysis-dimensions/specs/self-assessment-framework/spec.md"
  - id: FR-062
    title: 題目為自行設計並註明未經驗證
    description: 所有分析的題目 MUST 為自行設計，MUST NOT 翻譯、改寫或使用任何既有量表的題目；每個測驗頁與結果頁 MUST 固定註明「這些題目是自行設計的自我探索題目，沒有經過信度與效度驗證，不是任何既有量表」；版本識別 MUST 帶 ref 標記；MUST NOT 以百分位、常模或「精準」的說法呈現結果。
    priority: must
    phase: 7
    mvp: false
    context: [CTX-CON-022, CTX-CON-015, CTX-CON-001]
    source: "openspec/changes/expand-self-analysis-dimensions/specs/self-assessment-framework/spec.md"
    note: "延伸 CTX-CON-015（MBTI 題目自行撰寫、避免商標）到所有新增分析"
  - id: FR-063
    title: 九型人格
    description: 系統 SHALL 提供九型人格測驗（九個類型各有同數量的題目、5 點量表），計算九型各自的分數（0–100），最高分者為最突出的類型、側翼取相鄰兩型中分數較高者；最高分與次高分差距小於 10 分時 MUST 並列這兩型而不單獨斷定一型，MUST NOT 稱使用者「就是」某一型；每型有固定內容（核心動機、核心恐懼、壓力下與放鬆時的慣性、成長方向、可以留意的地方），聚焦「為什麼會這樣做」並與 MBTI 互補。
    priority: should
    phase: 7
    mvp: false
    context: [CTX-CON-021, CTX-CON-024, CTX-ASM-020, CTX-ASM-021]
    source: "openspec/changes/expand-self-analysis-dimensions/specs/enneagram-test/spec.md"
  - id: FR-064
    title: HEXACO 人格模型
    description: 系統 SHALL 提供 HEXACO 測驗（誠實謙遜、情緒性、外向性、宜人性、盡責性、開放性六個維度各有同數量的題目、含反向題、5 點量表），伺服器端計分為各維度 0–100 與低（< 40）、中（40–60）、高（> 60）；結果頁 SHALL 說明六個維度各自的意思並特別說明「誠實謙遜」，MUST NOT 把低分描述為不誠實或品格缺陷，MUST NOT 引用大五人格結果；HEXACO 發佈並開啟入口後 SHALL 取代大五人格測驗。
    priority: must
    phase: 7
    mvp: false
    context: [CTX-CON-021, CTX-CON-024, CTX-CON-025, CTX-ASM-020]
    source: "openspec/changes/expand-self-analysis-dimensions/specs/hexaco-test/spec.md"
  - id: FR-065
    title: VIA 品格優勢
    description: 系統 SHALL 提供品格優勢測驗（24 種優勢各有同數量的題目、5 點量表），計算 24 項分數並排序、取最突出的前 5 項，分數相同時 MUST 以固定規則決定先後使同樣作答永遠得到同樣結果；每項優勢有固定內容（是什麼、日常表現、用得太過時的樣子、如何發揮）；結果頁 MUST 以「我有哪些值得發揮的內在優勢」為主軸，MUST NOT 把排在後面的優勢描述成缺點。
    priority: should
    phase: 7
    mvp: false
    context: [CTX-CON-021, CTX-CON-024, CTX-ASM-020]
    source: "openspec/changes/expand-self-analysis-dimensions/specs/via-strengths-test/spec.md"
  - id: FR-066
    title: 霍蘭德職業興趣（RIASEC）
    description: 系統 SHALL 提供職業興趣測驗（六種類型各有同數量的自行設計題目、以喜歡程度作答），計算實作、研究、藝術、社會、企業、事務六型分數並取前三名組成三碼代碼（並列時以固定規則決定）；結果內容含六型特徵、偏好的工作環境與三碼組合的描述；結果頁 MUST 明確寫出「這是興趣，不是能力或適性的判定」，MUST NOT 列出「你適合當某某職業」的斷言。
    priority: should
    phase: 7
    mvp: false
    context: [CTX-CON-021, CTX-CON-024, CTX-CON-022, CTX-ASM-020]
    source: "openspec/changes/expand-self-analysis-dimensions/specs/riasec-interest-test/spec.md"
  - id: FR-067
    title: 情緒智商
    description: 系統 SHALL 提供情緒智商測驗（情緒覺察、情緒調節、同理心、人際情緒處理四個面向各有同數量的題目、含反向題），計算四面向各自的分數（0–100）與等級；MUST NOT 提供單一的「智商」總分，MUST NOT 使用百分位；每面向每等級有固定內容（現況、優勢、留意、可以練習的方向），並強調情緒能力可以練習而不是固定的。
    priority: should
    phase: 7
    mvp: false
    context: [CTX-CON-021, CTX-CON-024, CTX-CON-002, CTX-ASM-020]
    source: "openspec/changes/expand-self-analysis-dimensions/specs/emotional-intelligence-test/spec.md"
    note: "延伸 CTX-CON-002：不宣稱測得正式智力或智商"
  - id: FR-068
    title: 依附風格
    description: 系統 SHALL 提供依附風格測驗，以「靠近的焦慮」與「親密的迴避」兩個連續向度各自的題目計分（各 0–100 與低、中、高），依兩個向度的高低對應到四個象限的中性描述，任一向度為中時 MUST 說明結果落在兩個象限之間；MUST NOT 貼固定標籤、MUST NOT 使用診斷用語或提及臨床診斷；結果頁 MUST 固定說明依附模式會隨關係與經驗改變、不是診斷也不是固定標籤。
    priority: should
    phase: 7
    mvp: false
    context: [CTX-CON-021, CTX-CON-024, CTX-ASM-020, CTX-ASM-023]
    source: "openspec/changes/expand-self-analysis-dimensions/specs/attachment-style-test/spec.md"
  - id: FR-069
    title: 核心價值觀
    description: 系統 SHALL 提供約 40 項的價值清單，使用者從中挑選固定數量並把最重要的幾項排出順序；系統 MUST 驗證項目都在清單內、數量符合規定、沒有重複、排序只含已挑選的項目；結果列出最重要的幾項價值並附固定說明（可能代表什麼、在選擇中如何出現、與其他價值拉扯時可以怎麼想），以「什麼對我最重要？我為什麼做出某些選擇？」為主軸，MUST NOT 評價價值的好壞或高下。
    priority: should
    phase: 7
    mvp: false
    context: [CTX-CON-021, CTX-CON-024, CTX-ASM-020, CTX-ASM-023]
    source: "openspec/changes/expand-self-analysis-dimensions/specs/core-values-exercise/spec.md"
  - id: FR-070
    title: 需求與動機
    description: 系統 SHALL 提供需求與動機測驗，依自我決定理論的三項基本心理需求（自主、勝任、關係）各有同數量的題目，計算三項各自的分數（0–100）與等級（分數代表目前需求被滿足的感受）；每項每等級有固定內容（什麼情境容易讓動力上升、哪些環境可能讓動力下降、可以怎麼調整）；偏低的需求 SHALL 列為「值得留意」，MUST NOT 把低分描述為使用者的缺陷。
    priority: should
    phase: 7
    mvp: false
    context: [CTX-CON-021, CTX-CON-024, CTX-ASM-020]
    source: "openspec/changes/expand-self-analysis-dimensions/specs/psychological-needs-test/spec.md"
  - id: FR-071
    title: 移除大五人格測驗
    description: HEXACO 發佈並確認可用後，系統 SHALL 把現有的大五人格測驗從產品中移除：關閉入口、刪除所有使用者的 bigFiveAttempts 與 Firestore 的 BIGFIVE 固定內容、移除頁面與 API 與 service 與常數與計分工具、移除到期清除與刪帳號與索引例外中的 bigFiveAttempts 處理、移除 useExploration 與入口卡片中的大五處理、更新固定內容覆蓋預期總數、以 REMOVED 需求移除主 spec big-five-test；MUST 先清資料再移除處理程式，刪除正式資料前 MUST 再向使用者確認。
    priority: must
    phase: 7
    mvp: false
    context: [CTX-CON-025, CTX-CON-012, CTX-EXT-005, CTX-ASM-024]
    source: "openspec/changes/expand-self-analysis-dimensions/specs/big-five-test/spec.md；design.md 決定 8"
  - id: FR-072
    title: 每個自我分析都能在多維度分析中被選擇
    description: 系統 SHALL 讓登錄表中的每一種自我分析都能在多維度分析中與既有系統任意組合（至少兩個系統），由 AI 交叉比對；分析定義 MUST 提供報告轉接（事實、解讀、特質術語）、特質映射與基礎點數，缺少任一項 MUST NOT 能登錄；使用者 SHALL 只能選擇自己有未到期結果的分析，沒有結果的顯示不可選並引導去做測驗；選擇後 MUST 以最新一筆未到期結果為輸入；訪客 MUST NOT 取得多維度分析。
    priority: must
    phase: 7
    mvp: false
    context: [CTX-CON-026, CTX-CON-014, CTX-CON-021, CTX-ACTOR-002, CTX-ASM-025]
    source: "openspec/changes/expand-self-analysis-dimensions/specs/assessment-multi-dimension/spec.md"
  - id: FR-073
    title: 自我分析在組合中的點數與映射覆蓋
    description: 自我分析在多維度組合中的點數 SHALL 沿用既有算法（各系統基礎點數加總 × 1.2 無條件捨去、上限 30、至少兩個系統），每個自我分析 MUST 有明確的基礎點數；每個自我分析的特質映射 MUST 通過既有的覆蓋檢查、以「傾向」描述並經審稿後才可納入多維度分析。
    priority: must
    phase: 7
    mvp: false
    context: [CTX-CON-026, CTX-CON-014, CTX-ASM-025]
    source: "openspec/changes/expand-self-analysis-dimensions/specs/assessment-multi-dimension/spec.md；specs/trait-mapping/spec.md"
  - id: FR-074
    title: 單維度報告（規則版）
    description: 系統 SHALL 為星座、血型、生命靈數、MBTI、瑪雅 Kin、八字、人類圖等穩定特質系統提供單維度報告，由規則與預寫片段組裝、全部免費、MUST NOT 呼叫 AI、MUST NOT 扣點；報告依固定順序含位置結論、系統的事實與解讀、本系統的歸納、影響面向推測、建議與反思、依據與限制；歸納中每一條推論 MUST 引用系統事實中的具體項目，找不到事實支持的推論 MUST NOT 產生；缺少必要資料（例如出生時間）的區塊 MUST 標示缺少並顯示補填提示，MUST NOT 以猜測值代替。
    priority: must
    phase: 7
    mvp: false
    context: [CTX-CON-027, CTX-CON-007, CTX-CON-009, CTX-ACTOR-001]
    source: "openspec/specs/single-dimension-report/spec.md"
  - id: FR-075
    title: 影響面向、系統性質標籤與時間性內容標示
    description: 單維度報告 SHALL 為每個歸納面向展開影響面向推測（時間、對象、生活領域），只顯示有片段的格子，MUST NOT 以其他組合代替；過去的格子 MUST 為假設並附確認問題，使用者的回答 MUST NOT 被儲存；每份報告 SHALL 顯示該系統的性質標籤（MBTI 明標為自製問卷、不等於官方量表）；八字大運與流年、生命靈數流年數等時間性內容 MUST 標示依據的系統與產生日期，其他系統的時間解讀 MUST 標示為依特質的推測。
    priority: must
    phase: 7
    mvp: false
    context: [CTX-CON-027, CTX-CON-028, CTX-CON-016, CTX-CON-015, CTX-ACTOR-001]
    source: "openspec/specs/single-dimension-report/spec.md"
  - id: FR-076
    title: 狀態系統的精簡報告
    description: 系統 SHALL 為塔羅、盧恩與星座運勢提供精簡報告，只含位置結論、事實與解讀、建議與反思、依據與限制，MUST NOT 含本系統的歸納與影響面向推測；塔羅與盧恩須已登入且當天已抽才能產生，缺少時回明確的原因；這些每日報告 MUST NOT 寫入快照。
    priority: should
    phase: 7
    mvp: false
    context: [CTX-CON-027, CTX-CON-018, CTX-CON-029, CTX-ACTOR-001]
    source: "openspec/specs/single-dimension-report/spec.md"
  - id: FR-077
    status: deprecated
    reason: "單維度 AI 進階分析與多維度報告合併為唯一一種 AI 報告（change ai-analysis-question-history）：改為 POST /ai-reports，結果存 aiReports 集合，不再寫入快照的 ai 欄位，提問取代「輸入不含使用者自由文字」"
    supersededBy: ["FR-085", "FR-086"]
    title: 單維度 AI 進階分析
    description: 系統 SHALL 讓已登入使用者花 1 點取得單維度的 AI 進階分析；扣點 MUST 以冪等鍵防止重複，生成或品質檢查失敗 MUST 退點，點數不足 MUST 拒絕且不呼叫 AI；輸入 MUST 只含事實與規則找出的面向，不含使用者自由文字；輸出每段 MUST 標為 AI 綜合推論並附依據；結果 MUST 寫入快照獨立的 ai 欄位，MUST NOT 改動規則產生的基本內容，再次分析只替換 ai。
    priority: must
    phase: 7
    mvp: false
    context: [CTX-CON-027, CTX-CON-014, CTX-CON-009, CTX-EXT-002, CTX-ACTOR-002]
    source: "openspec/specs/single-dimension-report/spec.md"
  - id: FR-078
    status: deprecated
    reason: "多維度報告合併為唯一一種 AI 報告（change ai-analysis-question-history）：POST /multi-reports 移除；規則組裝的跨系統報告不再保存與呈現，只作 AI 的輸入素材（洞見候選）"
    supersededBy: ["FR-085", "FR-086", "FR-087"]
    title: 多維度報告
    description: 系統 SHALL 讓已登入使用者把至少兩個穩定特質系統放在同一套特質本體上，由規則組裝成報告並存為快照，再由 AI 針對這個人改寫洞見（AI 解讀已含在價格內）；價格 = 各系統基本價之和 × 1.2 無條件捨去、上限 30 點；請求 MUST 帶 Idempotency-Key，重複請求只回報目前狀態且不重複扣點；回 202 與快照 id，之後輪詢 aiJob 與 ai；缺少資料回 422（PROFILE_REQUIRED、BLOOD_REQUIRED、MBTI_REQUIRED、BIRTH_TIME_REQUIRED、BIRTH_PLACE_REQUIRED）、規則找不到任何洞見回 422（NO_INSIGHTS），皆不扣點；失敗 MUST 退點；訪客 MUST NOT 取得。
    priority: must
    phase: 7
    mvp: false
    context: [CTX-CON-027, CTX-CON-028, CTX-CON-014, CTX-ASM-026, CTX-EXT-002, CTX-ACTOR-002]
    source: "POST /multi-reports（API-057）；server/services/multiReport.service.ts"
  - id: FR-079
    title: 報告快照的內容
    description: 系統 SHALL 為每份已發布的報告儲存快照：位置結論、各區塊當時的全文（不只存固定內容的參照）、所用系統、版本資訊（ontology、mapping、fragments、templates）、計算依據與產生時間；每一段 MUST 標示種類（事實、系統解讀、AI 綜合推論、使用者自述之一）與來源，缺種類 MUST 被拒絕；時間性內容 MUST 隨快照存入並標示產生日期，MUST NOT 隨年份自動更新。
    priority: must
    phase: 7
    mvp: false
    context: [CTX-CON-029, CTX-CON-027, CTX-ACTOR-001]
    source: "openspec/specs/report-snapshots/spec.md"
  - id: FR-080
    title: 報告快照的存取、期限與清除
    description: 快照 MUST 僅本人可讀（他人讀取回找不到，不洩漏存在與否），API 輸入輸出 MUST 通過 schema 驗證；快照 SHALL 保存 6 個月，由每日到期作業清除，MUST NOT 對此集合開 Firestore TTL；刪除帳號與刪除資料的「報告」範圍 MUST 清除其全部快照，其他範圍 MUST NOT 動到快照；每人快照數有上限，超過時 MUST 先刪最舊的一份；相同的基本報告只保存一份；AI 分析不寫入快照（AI 報告另存，見 FR-088），快照上舊的 ai、aiJob 欄位不再寫入。
    priority: must
    phase: 7
    mvp: false
    context: [CTX-CON-029, CTX-CON-012, CTX-CON-006, CTX-EXT-005, CTX-ASM-027, CTX-ACTOR-001]
    source: "openspec/specs/report-snapshots/spec.md"
  - id: FR-081
    title: 特質本體
    description: 系統 SHALL 定義 28 條兩極特質軸（思考與認知、行動與節奏、情緒與表達、人際與關係、價值與動機五組），每條軸有穩定 ID 與恰好兩個端點，每個端點有名稱、說明與過度時的樣子，命名 MUST 為中性；另定義三組情境軸（時間 3、對象 10、生活領域 10，領域不含「人際關係」）；軸與端點 ID MUST 唯一且一經發布 MUST NOT 重用；內容改動 MUST 同步提高 ONTOLOGY_VERSION。
    priority: must
    phase: 7
    mvp: false
    context: [CTX-CON-028, CTX-ACTOR-003]
    source: "openspec/specs/trait-ontology/spec.md"
  - id: FR-082
    title: 特質映射與覆蓋檢查
    description: 系統 SHALL 為每個系統提供映射條目（system、term、axisEnd、method），term MUST 為該系統真實存在的原語彙、axisEnd MUST 存在、MUST NOT 帶強度或信心；MBTI、人類圖、八字用結構式，星座、血型、生命靈數、瑪雅 Kin 用關鍵字式；八字十神語句 MUST NOT 映射；塔羅、盧恩、星座運勢標為 state，MUST NOT 進穩定特質映射；56 個端點每一個 MUST 至少有一條映射，或列在已確認無來源的清單（清單不得過期）；整體覆蓋率低於 80% MUST 失敗；映射標示 sourceGroup，內容改動 MUST 同步提高 MAPPING_VERSION。
    priority: must
    phase: 7
    mvp: false
    context: [CTX-CON-028, CTX-ACTOR-003]
    source: "openspec/specs/trait-mapping/spec.md"
  - id: FR-083
    title: 情境片段
    description: 系統 SHALL 以（特質軸端點、情境值）為鍵提供預寫的一句話片段（10 個對象與 10 個生活領域）；時間值（過去、現在、未來）由模板產生；過去 MUST 為假設並附確認問題，未來只談傾向與可準備的方向，MUST NOT 使用醫療、法律、財務用語；片段 MUST 有覆蓋檢查，內容改動 MUST 同步提高 FRAGMENT_VERSION。
    priority: must
    phase: 7
    mvp: false
    context: [CTX-CON-028, CTX-CON-016, CTX-ACTOR-003]
    source: "openspec/specs/trait-context-fragments/spec.md"
  - id: FR-084
    title: 計算依據（basis）
    description: 系統 SHALL 為每份報告的事實附計算依據：系統（取自固定清單）、方法、規則版本與計算所用的輸入（只含必要欄位）；各重算型系統有規則版本常數與純函式 buildBasis，同一輸入與同一版規則 MUST 得到相同的 basis；塔羅與盧恩沿用現有的抽取版本，MBTI 的規則版本為作答時的測驗版本。
    priority: must
    phase: 7
    mvp: false
    context: [CTX-CON-027, CTX-CON-009, CTX-ACTOR-004]
    source: "openspec/specs/analysis-basis/spec.md"
  - id: FR-085
    title: AI 報告（建立）
    description: 系統 SHALL 只提供一種 AI 報告，讓已登入使用者選一個以上、互不相同的穩定特質系統（含自我分析）並可選填一段提問（100 字內、前後空白去除、空白視為沒有）來建立；價格 MUST 為一個系統 1 點、兩個以上為各系統基本價之和 × 1.2 無條件捨去且上限 30 點；請求 MUST 帶 Idempotency-Key（即報告 id），重複請求只回報目前狀態且不重複扣點；回 202 與報告 id；建立前 MUST 確保每個系統的單維度報告已保存並記在 sources（system、snapshotId、當時的位置結論）；兩個以上系統時規則 MUST 先找跨系統洞見作為 AI 的輸入素材，找不到任何洞見回 422 NO_INSIGHTS；缺資料回 422、點數不足回 402、提問過長或系統選擇無效回 400，皆不扣點且不呼叫 AI；生成失敗或品質檢查失敗 MUST 在同一交易內標為失敗並退點（只退一次）；每人每小時與每日有生成次數上限；訪客 MUST NOT 取得。
    priority: must
    phase: 7
    mvp: false
    context: [CTX-CON-027, CTX-CON-028, CTX-CON-014, CTX-CON-030, CTX-ASM-026, CTX-ASM-029, CTX-EXT-002, CTX-ACTOR-002]
    source: "openspec/changes/ai-analysis-question-history/specs/ai-report/spec.md；POST /ai-reports；server/services/aiReport.service.ts"
  - id: FR-086
    title: AI 報告的骨架與導師視角
    description: 系統 SHALL 讓 AI 報告依固定順序呈現：事實攤開（每份來源報告只列標題與一句摘要，由系統取自該報告、在 AI 完成前就存在、MUST NOT 由 AI 撰寫）、值得注意的點、共同的優勢、共同的劣勢與需要留意的地方、過去、現在、未來、回應你的提問（只有提問時才有）、結論與提醒；除過去與現在外，每一部分 MUST 是一段開頭加條列重點（值得注意的點、共同的優勢、共同的劣勢、回應提問、結論各 3 到 5 點，未來 2 到 4 點對應的提醒）；優勢與劣勢 MUST 取各份報告共同指向的；系統 prompt MUST 要求 AI 以融合心理學、命相學與神秘學視角的同一位導師，縱觀提問者的過去、現在與未來的狀態、可能發生的事件類型與提醒，並逐章說明開頭與條列的寫法與數量；談未來只說可能與傾向，MUST NOT 給確切日期、人名或結果、吉凶斷言、壽命或疾病或婚姻成敗或財運的預言，MUST NOT 做診斷或給醫療、法律、財務建議；交給 AI 的內容 MUST 只含今天的日期、各來源報告的系統與位置結論與事實與面向與限制、規則找到的洞見候選與提問，不含使用者 id 或電子郵件；Prompt 版本 MUST 隨報告保存。
    priority: must
    phase: 7
    mvp: false
    context: [CTX-CON-027, CTX-CON-030, CTX-CON-009, CTX-EXT-002, CTX-ACTOR-002]
    source: "openspec/changes/ai-analysis-question-history/specs/ai-report/spec.md；server/ai/reportPrompt.ts；shared/schemas/firestore/aiAnalysis.schema.ts"
  - id: FR-087
    title: 分析紀錄與 AI 報告頁
    description: 系統 SHALL 提供會員專屬的「分析紀錄」（header nav，/ai-reports）與 GET /api/ai-reports，以單一列表呈現使用者未到期的 AI 報告卡片（新到舊、最多 100 筆，不含報告內容，顯示建立時間、來源位置結論、提問與狀態），並提供 GET /api/ai-reports/{id} 與報告頁讀取全文；報告頁依骨架呈現（分析概要、事實攤開、值得注意的點、共同的優勢與劣勢、過去現在未來的垂直時間線、回應提問、結論），條列以清單呈現；生成中 MUST 顯示進度並自動更新，完成或失敗後刷新點數；失敗 MUST 顯示已退點並可帶原系統與原問題「再問一次」；生成中而逾時的報告 MUST 在被讀取時標為失敗並退點；他人的、不存在的與已到期的報告 MUST 回找不到；單維度報告最後 MUST 提供「深入分析」入口並預選該系統，「綜合分析」頁（/report）作為建立表單，送出後導向分析紀錄；訪客開啟分析紀錄 MUST 只見登入提示。
    priority: must
    phase: 7
    mvp: false
    context: [CTX-CON-027, CTX-CON-029, CTX-CON-014, CTX-ACTOR-002]
    source: "openspec/changes/ai-analysis-question-history/specs/ai-report/spec.md、site-navigation/spec.md、single-dimension-report/spec.md"
  - id: FR-088
    title: AI 報告的存取、期限與清除
    description: 系統 SHALL 把 AI 報告存於使用者自己的 aiReports 集合（一份一筆，id 為冪等鍵，含 sources、提問、狀態、內容、點數、模型與 prompt 版本、建立與到期時間），MUST 僅本人可讀；報告 SHALL 保存 6 個月（建立時間加 6 個月），由每日到期作業清除，MUST NOT 對此集合開 Firestore TTL；刪除帳號與刪除資料的「報告」範圍 MUST 清除其全部 AI 報告，其他範圍 MUST NOT 動到，也 MUST NOT 影響其他使用者；報告 MUST 自足，來源單維度報告被清除後仍可閱讀；再問一次 MUST 新增一份而不覆蓋舊報告；快照上舊的 ai、aiJob 欄位不再寫入、不遷移，隨快照到期。
    priority: must
    phase: 7
    mvp: false
    context: [CTX-CON-029, CTX-CON-012, CTX-CON-006, CTX-EXT-005, CTX-ASM-027, CTX-ACTOR-001]
    source: "openspec/changes/ai-analysis-question-history/specs/ai-report/spec.md；firestore.indexes.json；scripts/provision-firebase.ts"
  - id: FR-089
    title: 每日免費一卦
    description: "系統 SHALL 讓已登入使用者每台北日期第一次起卦免費；同一帳號同一日的第一卦 MUST 寫入紀錄，之後查詢與換裝置 MUST 得到同一卦；訪客 SHALL 可起當日免費的一卦，MUST NOT 寫入任何伺服器紀錄，同一 session 同一日 MUST 得到同一卦；日期 MUST 由伺服器以台北時間換算，MUST NOT 接受客戶端日期或身分。"
    priority: must
    phase: 8
    mvp: false
    context: [CTX-ACTOR-001, CTX-CON-016, CTX-CON-031, CTX-CON-032, CTX-ASM-031, CTX-EXT-005, CTX-EXT-006]
    source: "user 對話（2026-11-09 易經卦象 D1–D7）；openspec/specs/daily-rune/spec.md；server/services/dailyDraw.engine.ts"
    note: "訪客規則比照盧恩的訪客抽取"
  - id: FR-090
    title: 付費加卦
    description: "系統 SHALL 讓已登入使用者在當日已起第一卦後再起卦，每卦扣 1 點；點數不足 MUST 拒絕、MUST NOT 寫紀錄或扣點；扣點與紀錄 MUST 原子且以冪等鍵只處理一次，起卦或寫入失敗 MUST 返還已扣點；訪客 MUST NOT 加卦並 MUST 被引導登入；扣點前 MUST 讓使用者看見「將扣 1 點」並確認。"
    priority: must
    phase: 8
    mvp: false
    context: [CTX-ACTOR-001, CTX-ACTOR-002, CTX-CON-032, CTX-CON-014, CTX-ASM-035, CTX-EXT-005]
    source: "user 對話（2026-11-09 易經卦象 D1–D7）；openspec/specs/daily-rune/spec.md；server/services/dailyDraw.engine.ts"
    note: "沿用 points-system 的原子扣點與失敗返還"
  - id: FR-091
    title: 銅錢法起卦與變卦
    description: "系統 SHALL 以三枚銅錢法產生六爻（由下往上，每爻為老陰、少陽、少陰或老陽），回傳本卦、動爻位置與變卦（無動爻時沒有變卦）；結果 MUST 由伺服器依「對象、台北日期、當日序號、規則版本」決定性產生，同輸入同版本 MUST 得到同一結果；請求 MUST NOT 能指定日期、身分、序號或爻值；規則版本 MUST 隨每筆紀錄保存。"
    priority: must
    phase: 8
    mvp: false
    context: [CTX-CON-031, CTX-ASM-030, CTX-ASM-031, CTX-ASM-032]
    source: "user 對話（2026-11-09 易經卦象 D1–D7）；openspec/specs/daily-rune/spec.md；server/services/dailyDraw.engine.ts"
    note: "決定性來源待確認（CTX-ASM-031）"
  - id: FR-092
    title: 卦象內容與詮釋
    description: "系統 SHALL 依動爻數量呈現內容：無動爻顯示本卦的卦辭、彖辭、象辭與白話解讀；一個動爻另顯示該爻的爻辭與白話；兩個以上動爻只列本卦與變卦（卦名與簡述）；內容 MUST 為事先寫好的固定內容（64 卦＋384 爻），MUST NOT 呼叫 AI，MUST NOT 含吉凶斷語或預言，語氣為「這一刻的狀態，不是預言」；所需內容缺少時 MUST 起卦失敗且不扣點。"
    priority: must
    phase: 8
    mvp: false
    context: [CTX-CON-031, CTX-CON-033, CTX-CON-007, CTX-CON-016, CTX-ACTOR-003, CTX-ASM-032]
    source: "user 對話（2026-11-09 易經卦象 D1–D7）；openspec/specs/daily-rune/spec.md；server/services/dailyDraw.engine.ts"
    note: "內容撰寫分批（CTX-CON-033）"
  - id: FR-093
    title: 卦象紀錄與查詢
    description: "系統 SHALL 為已登入者每起一卦保存一筆紀錄（台北日期、當日序號、六爻、起卦時間、規則版本、是否付費、對應扣點交易），僅本人可讀；SHALL 提供查詢今日已起各卦的 API（只讀、不寫）；刪除帳號與刪除資料 MUST 清除這些紀錄；紀錄 SHALL 保存 3 個月（起卦時間加 3 個月），由每日到期作業清除，MUST NOT 使用 Firestore TTL（CTX-ASM-034）。"
    priority: must
    phase: 8
    mvp: false
    context: [CTX-ACTOR-001, CTX-CON-012, CTX-CON-032, CTX-ASM-033, CTX-ASM-034, CTX-EXT-005]
    source: "user 對話（2026-11-09 易經卦象 D1–D7）；openspec/specs/daily-rune/spec.md；server/services/dailyDraw.engine.ts"
    note: "保存 3 個月已確認；塔羅盧恩仍為永久，是否一併改為 3 個月另案確認"
  - id: FR-094
    title: 卦象的前端呈現
    description: "系統 SHALL 在「此刻／今日」區塊提供卦象入口並標示結果隨時間變動；起卦時六爻 SHALL 由下而上逐爻浮現並標明少陰、少陽、老陰或老陽，最後並排呈現本卦與變卦；六爻 MUST 以向量圖繪製，MUST NOT 依賴卦象 Unicode 字元；畫面結果 MUST 取自 API 回應，動畫只負責播放；MUST 尊重 prefers-reduced-motion。"
    priority: should
    phase: 8
    mvp: false
    context: [CTX-ACTOR-001, CTX-CON-016, CTX-CON-031]
    source: "user 對話（2026-11-09 易經卦象 D1–D7）；openspec/specs/daily-rune/spec.md；server/services/dailyDraw.engine.ts"
    note: "首頁今日區塊的規則見 FR-044"
  - id: FR-095
    title: 卦象不進報告管線
    description: "系統 MUST NOT 為卦象提供單維度報告、綜合分析的可選系統、特質映射或 AI 報告來源；卦象 MUST NOT 寫入報告快照；起卦請求 MUST NOT 收「想問的事」或任何使用者自由文字。"
    priority: must
    phase: 8
    mvp: false
    context: [CTX-CON-031, CTX-CON-007]
    source: "user 對話（2026-11-09 易經卦象 D1–D7）；openspec/specs/daily-rune/spec.md；server/services/dailyDraw.engine.ts"
    note: "範圍排除，供驗證用；對應 FR-076 的狀態系統規則（卦象不提供該精簡報告）"

nonFunctional:
  - id: NFR-001
    category: security
    title: 外部輸入驗證
    description: 所有外部輸入（request、query、params、body、headers、cookies）MUST 於後端做 runtime 驗證，不得信任前端驗證。
    metric: "所有 API 皆有 schema 驗證；未通過者回傳明確錯誤"
    priority: must
    context: [CTX-CON-003]
    source: "plan §8.1；全域 security 規則"
    note: "計畫書未明述，來自專案全域規範，需確認"
  - id: NFR-002
    category: security
    title: 秘密與金鑰保護
    description: AI API 金鑰、付款密鑰與敏感設定 MUST NOT 出現在前端程式碼，且 MUST 僅由後端保管。
    metric: "前端 bundle 中 0 個秘密金鑰"
    priority: must
    context: [CTX-CON-003, CTX-EXT-001, CTX-EXT-002]
    source: "plan §6.4, §8.1"
  - id: NFR-003
    category: security
    title: 授權與存取控制
    description: 付費功能與報告存取 MUST 由後端授權；使用者僅能存取自己的資料。
    metric: "未授權存取一律被拒絕（需以測試驗證）"
    priority: must
    context: [CTX-CON-003, CTX-ACTOR-002, CTX-EXT-005, CTX-EXT-006]
    source: "plan §8.1"
    note: "Firestore 僅由 Nuxt 伺服器端存取，client 直連一律拒絕（rules 全擋）；API 預設需驗證 ID token，訪客可用端點須明列為公開（CTX-CON-013）"
  - id: NFR-004
    category: security
    title: Webhook 可靠性
    description: 付款 webhook MUST 驗證簽章且重複事件不得造成重複授權或重複記錄。
    metric: "同一事件重送 N 次，最終狀態與送一次相同"
    priority: must
    context: [CTX-EXT-001]
    source: "plan §8.1"
  - id: NFR-005
    category: privacy
    title: 資料最小化與保留
    description: 系統只蒐集功能所需資料，並依保留政策決定測驗答案、輸入快照的保存期限，不無限期保留不必要個資。
    metric: "測驗結果、多維度分析報告、MBTI、人類圖、每日抽取紀錄、即時星象報告保留 3 個月；詳細分析保留 6 個月；付款紀錄於帳號存續期間永久保存；刪除帳號時移除全部紀錄（贈點紀錄保留 3 個月）；訪客暫存結果 TTL 1 天"
    priority: must
    context: [CTX-CON-006, CTX-CON-012]
    source: "plan §3.1, §7.2, §13.3；user 補充"
  - id: NFR-006
    category: privacy
    title: 日誌敏感資料
    description: 日誌 MUST NOT 寫入不必要的敏感答案或完整個人報告。
    metric: "日誌抽樣檢查 0 筆完整答案/報告內容"
    priority: must
    context: [CTX-CON-006]
    source: "plan §13.3"
  - id: NFR-007
    category: compliance
    title: 結果免責與內容合規
    description: 所有固定與 AI 結果 MUST 標示娛樂/自我探索性質；AI 對心理健康、診斷或危機內容須限制並引導。
