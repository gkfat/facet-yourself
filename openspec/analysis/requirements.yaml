  - id: FR-009
    title: 多維度分析報告 組合覆蓋完整性
    description: 系統 SHALL 使所有合法組合都有可查詢的多維度分析報告：星座×MBTI 192 種，以及星座×MBTI×血型 768 種（共 960 種），且組合與內容 MUST 存放於 Firestore。
    priority: must
    phase: 2
    mvp: true
    context: [CTX-ACTOR-003, CTX-ASM-005, CTX-EXT-005, CTX-CON-005]
    source: "plan §5.1, §11 Phase 2 完成標準；user 補充"
    note: "多維度分析報告 共 960 種（user 已確認）；含人類圖的組合屬詳細分析（FR-036）。產製方式：星座 12、MBTI 16、血型 4 各寫基礎描述，再補每組合的交叉洞察；先做約 20 個代表組合試讀再擴到 960；草稿可於上線前離線以 AI 產生並經人審，執行期不呼叫 AI"
  - id: FR-010
    title: 結果分享卡
