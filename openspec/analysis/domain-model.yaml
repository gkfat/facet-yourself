businessRules:
  - id: RULE-001
    description: "生日與星座為必填；血型、MBTI、出生時間與地點為選填"
    appliesTo: ["AGG-001"]
    useCases: ["UC-003"]
  - id: RULE-002
    description: "血型為未知時不計入組合鍵與分析"
    appliesTo: ["VO-004"]
    useCases: ["UC-004", "UC-050", "UC-054"]
  - id: RULE-003
    description: "多維度分析報告 的組合鍵只有「星座+MBTI」與「星座+MBTI+血型」兩種，缺 MBTI 不可取得；共 960 種"
    appliesTo: ["VO-004"]
    useCases: ["UC-019", "UC-050", "UC-054"]
  - id: RULE-004
    description: "訪客不可取得多維度分析報告 與詳細分析，使用點數前必須已登入"
    appliesTo: ["AGG-001"]
    useCases: ["UC-050", "UC-049", "UC-054"]
  - id: RULE-005
    status: deprecated
    reason: "summary 組合已不存在，多維度報告改為規則組裝後存快照"
    supersededBy: ["RULE-085"]
    description: "會員首次取得某組多維度分析報告 扣 1 點；同會員同組合已取得則不再扣點"
    appliesTo: ["AGG-006"]
    useCases: ["UC-007"]
  - id: RULE-006
    status: deprecated
    reason: "詳細分析（5 點）已被單維度 AI 進階分析（1 點）與多維度報告取代"
    supersededBy: ["RULE-084", "RULE-085"]
    description: "生成詳細分析扣 5 點；已生成過的組合重新生成同樣扣 5 點；舊報告保留"
    appliesTo: ["AGG-007"]
    useCases: ["UC-009", "UC-013"]
  - id: RULE-007
    description: "點數僅能從未過期批次扣抵，順序為先到期先扣、無限期批次最後，餘額不得為負，扣抵須原子且冪等"
    appliesTo: ["AGG-008"]
    useCases: ["UC-050", "UC-049", "UC-054"]
  - id: RULE-008
    description: "購買的點數為無限期，贈點有效期 90 天；過期點數不可用"
    appliesTo: ["ENT-009"]
    useCases: ["UC-014"]
  - id: RULE-009
    description: "註冊贈點每帳號僅發放一次，共 3 點"
    appliesTo: ["AGG-008"]
    useCases: ["UC-002"]
  - id: RULE-010
    description: "詳細分析生成失敗時，已扣點數須返還"
    appliesTo: ["AGG-008"]
    useCases: ["UC-049", "UC-050", "UC-054"]
  - id: RULE-011
    description: "付款 webhook 須驗簽，並以事件 ID 冪等處理"
    appliesTo: ["AGG-009"]
    useCases: ["UC-011"]
  - id: RULE-012
    description: "付款後不提供退款；付款前須明確告知，並須使用者勾選同意立即提供數位內容、放棄解約，且記錄同意時間與條款版本"
    appliesTo: ["AGG-009"]
    useCases: ["UC-010"]
  - id: RULE-013
    description: "人類圖須同時有出生時間與出生地點才可計算"
    appliesTo: ["VO-005"]
    useCases: ["UC-008", "UC-049", "UC-050", "UC-054"]
  - id: RULE-014
    description: "會員的測驗結果、多維度分析報告、MBTI 欄位與人類圖結果保存 3 個月，以各筆產生時間起算"
    appliesTo: ["ENT-004"]
    useCases: ["UC-005", "UC-017", "UC-050", "UC-054"]
  - id: RULE-015
    description: "付款紀錄於帳號存續期間永久保存，刪除帳號時一併移除"
    appliesTo: ["AGG-009"]
    useCases: ["UC-016"]
  - id: RULE-016
    description: "訪客暫存以 session id 識別，TTL 1 天，不與帳號關聯"
    appliesTo: ["ENT-002"]
    useCases: ["UC-003", "UC-005", "UC-006"]
  - id: RULE-017
    description: "固定結果（單項、summary、人類圖）不呼叫 AI"
    appliesTo: ["AGG-005"]
    useCases: ["UC-004", "UC-008", "UC-050", "UC-054"]
  - id: RULE-018
    description: "單項免費結果不儲存，每次重新取得"
    appliesTo: ["AGG-005"]
    useCases: ["UC-004"]
  - id: RULE-019
    status: deprecated
    reason: "與 RULE-087（快照僅本人可讀）重複"
    supersededBy: ["RULE-087"]
    description: "報告僅擁有者可存取"
    appliesTo: ["AGG-007"]
    useCases: ["UC-012"]
  - id: RULE-020
    status: deprecated
    reason: "AI 報告的內容規則改由 RULE-096（輸出品質把關）與 RULE-097（導師視角與內容界線）涵蓋；AI 不再逐段附依據"
    supersededBy: ["RULE-096", "RULE-097"]
    description: "AI 分析（單維度進階分析與多維度報告的 ai 欄位）須區分直接觀察與 AI 推測、每段附依據，不得含診斷式內容"
    appliesTo: ["AGG-021"]
    useCases: ["UC-049", "UC-050", "UC-054"]
  - id: RULE-021
    description: "固定內容組合須唯一，經審核才可發布"
    appliesTo: ["AGG-005"]
    useCases: ["UC-019"]
  - id: RULE-022
    description: "AI 生成須受 Token、頻率、額度與逾時限制"
    appliesTo: ["AGG-010"]
    useCases: ["UC-049", "UC-050", "UC-020", "UC-054"]
  - id: RULE-023
    description: "所有結果與報告須附娛樂／自我探索性質的免責說明"
    appliesTo: ["ENT-005"]
    useCases: ["UC-004", "UC-005", "UC-008", "UC-050", "UC-051", "UC-054"]
  - id: RULE-024
    description: "刪除帳號時移除該使用者的全部紀錄（個人資料、測驗結果、summary、詳細分析、人類圖、點數、付款），僅保留贈點紀錄；AI 用量紀錄保留但清除 userId"
    appliesTo: ["AGG-001"]
    useCases: ["UC-016"]
  - id: RULE-025
    description: "同一請求（相同冪等鍵）的並行生成或扣點只處理一次：點數帳本只扣一次，快照只保存一份"
    appliesTo: ["AGG-021", "AGG-008"]
    useCases: ["UC-049", "UC-050", "UC-054"]
  - id: RULE-026
    description: "分享卡不得包含不必要的個人資料"
    appliesTo: ["VO-011"]
