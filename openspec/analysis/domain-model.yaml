      - { name: acknowledgedUnsourcedEnds, type: "string[]", description: "已確認沒有來源的端點，不得過期" }
  - id: ENT-027
    name: ContextFragment
    nameZh: "情境片段"
    description: "以（軸端點, 情境值）為鍵的預寫一句話；時間值由模板產生；程式內的固定定義"
    useCases: ["UC-047", "UC-053"]
    attributes:
      - { name: key, type: "string", description: "軸端點與情境值" }
      - { name: text, type: "string", description: "預寫的一句話" }
      - { name: confirmQuestion, type: "string | null", description: "過去格子的確認問題，回答不儲存" }
      - { name: fragmentVersion, type: "string", description: "內容改動時同步提高" }
  - id: ENT-028
    name: AiReport
    nameZh: "AI 報告"
    description: "唯一一種 AI 報告：由一個以上單維度報告綜合而成，帶使用者的選填提問；自帶生成狀態與退點，6 個月到期；取代快照上的 ai 欄位與規則組裝的多維度報告"
    useCases: ["UC-054", "UC-055", "UC-056", "UC-052"]
    attributes:
      - { name: id, type: "string", description: "即請求的 Idempotency-Key" }
      - { name: userId, type: "string", description: "存於該使用者自己的 aiReports 之下，僅本人可讀" }
      - { name: sources, type: "VO-037[]", description: "所用的單維度報告，至少一筆" }
      - { name: question, type: "VO-038 | null", description: "使用者的提問，沒提問為 null" }
      - { name: status, type: "enum", description: "GENERATING | COMPLETED | FAILED" }
      - { name: failureReason, type: "string | null", description: "失敗原因（點數已退）；逾時為 STALE" }
      - { name: blocks, type: "VO-028[]", description: "完成前只含事實攤開塊；完成後附加導師的各段（AI_INFERENCE）" }
      - { name: cost, type: "number", description: "實際扣的點數" }
      - { name: modelName, type: "string | null", description: "完成前為 null" }
      - { name: promptVersion, type: "string | null", description: "完成前為 null" }
      - { name: createdAt, type: "timestamp", description: "" }
      - { name: expiresAt, type: "timestamp", description: "建立後 6 個月" }

