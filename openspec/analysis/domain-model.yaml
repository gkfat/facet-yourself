      - { name: points, type: "{ min, max }", description: "條列數量：值得注意的點、共同的優勢、共同的劣勢、回應提問、結論各 3 到 5，未來 2 到 4，過去與現在 0" }

aggregates:
  - id: AGG-001
    name: UserAccount
    root: ENT-001
    members: ["VO-001", "VO-002", "VO-003"]
    useCases: ["UC-001", "UC-002", "UC-003", "UC-015", "UC-016"]
    rationale: "帳號與個人資料需一致更新，且刪除帳號時整體處理"
  - id: AGG-002
    name: GuestSession
    root: ENT-002
    members: ["VO-001", "VO-002", "VO-003"]
    useCases: ["UC-003", "UC-005", "UC-006"]
    rationale: "訪客暫存資料以 session 為界，TTL 到期整體清除，登入時整體轉入帳號"
  - id: AGG-003
    name: TestDefinition
    root: ENT-003
    members: ["VO-007"]
    useCases: ["UC-005"]
    rationale: "測驗版本、題目與評分規則須一起版本化"
  - id: AGG-004
    name: TestAttemptRecord
    root: ENT-004
    members: ["VO-006"]
    useCases: ["UC-005", "UC-006", "UC-017"]
    rationale: "一次作答與其結果須一致，且以相同期限一起到期"
  - id: AGG-005
    name: FixedContentItem
    root: ENT-005
    members: ["VO-004"]
    useCases: ["UC-004", "UC-019", "UC-023", "UC-024", "UC-025", "UC-026", "UC-044", "UC-050", "UC-054"]
    rationale: "單筆固定內容的版本與審核狀態須一致；組合唯一"
  - id: AGG-006
    status: deprecated
    reason: "隨 ENT-006 取代為 AGG-021 ReportSnapshotRecord"
    name: MemberSummaryRecord
    root: ENT-006
    members: ["VO-004"]
    useCases: ["UC-007", "UC-017"]
    rationale: "每位會員每個組合只有一筆，作為避免重複扣點的判斷依據"
  - id: AGG-007
    status: deprecated
    reason: "隨 ENT-007 取代為 AGG-021 ReportSnapshotRecord"
    name: DetailedReportRecord
    root: ENT-007
    members: ["VO-008", "VO-009", "VO-005"]
    useCases: ["UC-009", "UC-012", "UC-013"]
    rationale: "單份報告的狀態、章節與輸入快照須一致；每次重新生成為新的聚合，舊報告保留"
  - id: AGG-008
    name: PointLedger
    root: ENT-008
    members: ["ENT-009", "ENT-010"]
    useCases: ["UC-002", "UC-011", "UC-014", "UC-027", "UC-050", "UC-049", "UC-054"]
    rationale: "餘額、批次與異動必須同一交易內更新，防止超扣與重複入帳"
  - id: AGG-009
    name: PaymentRecord
    root: ENT-011
    members: ["VO-010"]
    useCases: ["UC-010", "UC-011", "UC-016"]
    rationale: "付款狀態與已處理事件 ID 須一致，確保 webhook 冪等"
  - id: AGG-010
    name: AiUsage
    root: ENT-012
    members: []
    useCases: ["UC-020", "UC-027", "UC-049", "UC-050", "UC-054"]
    rationale: "追加式用量紀錄，單筆即一致性邊界"
  - id: AGG-011
    status: deprecated
    reason: "隨 ENT-013 一併廢止"
    name: ProductEventRecord
    root: ENT-013
    members: []
    useCases: ["UC-020"]
    rationale: "追加式事件紀錄，單筆即一致性邊界"
  - id: AGG-012
    name: HumanDesignRecord
    root: ENT-014
    members: ["VO-005"]
    useCases: ["UC-008", "UC-015"]
    rationale: "每位會員一份人類圖結果，重新計算時整份替換"
  - id: AGG-013
    name: WelcomeGrantLedger
    root: ENT-016
    members: []
    useCases: ["UC-002"]
    rationale: "贈點紀錄獨立於使用者帳號，刪除帳號時保留；與建立帳號、發放贈點在同一交易內判斷"
  - id: AGG-014
    name: DailyMetricsRecord
    root: ENT-017
    members: []
    useCases: ["UC-020"]
    rationale: "每日指標以日期為單位，計數原子遞增"

  - id: AGG-015
    name: DailyDrawRecord
    root: ENT-018
    members: ["VO-018"]
    useCases: ["UC-022", "UC-023", "UC-024"]
    rationale: "同帳號、同台北日期、同類抽取只能有一筆；以日期為唯一編號，在交易內「不存在才建立」，並行請求不會寫出兩份不同的結果"
  - id: AGG-016
    name: DailyKinUnlockRecord
    root: ENT-019
    members: ["VO-017"]
    useCases: ["UC-022", "UC-025"]
    rationale: "同帳號同日只能解鎖一次；解鎖紀錄與當日 Kin 快照同時建立"
  - id: AGG-017
    name: TransitReportRecord
    root: ENT-020
    members: ["VO-016", "VO-008", "VO-013", "VO-014", "VO-015", "VO-012"]
    useCases: ["UC-022", "UC-027", "UC-028", "UC-029"]
    rationale: "單份報告的狀態、章節與輸入快照須一致；同帳號、同台北日期、同本命資料版本只有一份，與扣點在同一交易內建立"
  - id: AGG-018
    name: AssessmentDefinition
    root: ENT-021
    members: ["VO-019"]
    useCases: ["UC-031", "UC-032", "UC-035", "UC-044", "UC-046"]
    rationale: "題目、計分規則、結果內容金鑰與入口旗標屬同一版本的定義，須一起發佈、一起生效；新增分析只新增一份定義"
  - id: AGG-019
    name: AssessmentAttemptRecord
    root: ENT-022
    members: ["VO-020", "VO-021", "VO-022", "VO-023", "VO-024", "VO-025", "VO-026", "VO-027"]
    useCases: ["UC-031", "UC-032", "UC-033", "UC-034", "UC-017", "UC-046"]
    rationale: "一次作答與其結果須一致，以送出時的版本計分，並以相同期限一起到期、一起刪除"
  - id: AGG-020
    name: BigFiveAttemptRecord
    root: ENT-023
    members: []
    useCases: ["UC-045"]
    rationale: "大五人格紀錄隨整個測驗移除；須先於處理程式被清除，否則會成為沒有人清的孤兒資料"
    status: deprecated
    reason: "隨大五人格移除（UC-045）；已移除完成"
  - id: AGG-021
    name: ReportSnapshotRecord
    root: ENT-024
    members: ["VO-028", "VO-029", "VO-030", "VO-031", "VO-032", "VO-033"]
    useCases: ["UC-047", "UC-049", "UC-050", "UC-051", "UC-052", "UC-048", "UC-021", "UC-054"]
    rationale: "報告全文、版本與依據同屬一份快照，須一致保存、一起到期、一起刪除；AI 報告不再寫入快照（見 AGG-025），舊的 ai、aiJob 欄位隨快照到期"
  - id: AGG-022
    name: TraitOntologyDefinition
    root: ENT-025
    members: ["VO-034", "VO-035"]
    useCases: ["UC-047", "UC-053"]
    rationale: "軸、端點與情境值的 ID 與版本須整體一致，內容改動時一起提高版本"
  - id: AGG-023
    name: TraitMappingDefinition
    root: ENT-026
    members: ["VO-036"]
    useCases: ["UC-047", "UC-050", "UC-053", "UC-054"]
    rationale: "各系統的映射須一起通過覆蓋檢查，版本一起提高"
  - id: AGG-024
    name: ContextFragmentSet
    root: ENT-027
    members: []
    useCases: ["UC-047", "UC-053"]
    rationale: "片段須與軸端點與情境值一一對應並一起通過覆蓋檢查"
  - id: AGG-025
    name: AiReportRecord
    root: ENT-028
    members: ["VO-037", "VO-038", "VO-028", "VO-029"]
    useCases: ["UC-054", "UC-055", "UC-052"]
    rationale: "報告的來源、提問、狀態、內容與扣點必須一起建立、一起完成或失敗；失敗標記與退點在同一交易內完成且只退一次；來源與提問隨報告一起到期、一起刪除"

