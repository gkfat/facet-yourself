    useCases: ["UC-051", "UC-052"]
  - id: RULE-088
    description: "每人快照數有上限，超過時先刪最舊的一份；相同的基本報告只保存一份；AI 報告不寫入快照（見 RULE-100），建立 AI 報告時相同的單維度報告重用而不複製"
    appliesTo: ["AGG-021"]
    useCases: ["UC-049", "UC-052", "UC-054"]
  - id: RULE-089
    description: "特質本體有 28 條兩極軸（五組），每軸恰有兩個端點，每個端點有名稱、說明與過度時的樣子，命名中性；情境軸為時間 3、對象 10、領域 10，領域不含「人際關係」；ID 唯一且一經發布不重用；內容改動時同步提高 ONTOLOGY_VERSION"
    appliesTo: ["AGG-022"]
    useCases: ["UC-053"]
  - id: RULE-090
    description: "映射條目的 term 須為該系統真實存在的原語彙、axisEnd 須存在、不帶強度或信心；MBTI、人類圖、八字用結構式，其餘穩定系統用關鍵字式；八字十神語句不映射；塔羅、盧恩、星座運勢標為 state，不進穩定特質"
    appliesTo: ["AGG-023"]
    useCases: ["UC-053"]
  - id: RULE-091
    description: "56 個端點每一個須至少有一條映射，或列在已確認無來源的清單（清單上的端點一旦有映射須移除，清單不得過期）；整體覆蓋率不得低於 80%；映射標示 sourceGroup，內容改動時同步提高 MAPPING_VERSION"
    appliesTo: ["AGG-023"]
    useCases: ["UC-053"]
  - id: RULE-092
    description: "情境片段以（軸端點, 情境值）為鍵；時間值由模板產生，過去為假設並附確認問題，未來只談傾向與可準備的方向，不使用醫療、法律、財務用語；內容改動時同步提高 FRAGMENT_VERSION"
    appliesTo: ["AGG-024"]
    useCases: ["UC-047", "UC-053"]
  - id: RULE-093
    description: "每份報告的事實附計算依據（系統取自固定清單、方法、規則版本、必要的輸入）；同一輸入與同一版規則得到相同的依據；塔羅與盧恩沿用現有抽取版本，MBTI 的規則版本為作答時的測驗版本"
    appliesTo: ["AGG-021"]
    useCases: ["UC-047"]
  - id: RULE-094
    description: "建立 AI 報告：選一個以上、互不相同的穩定特質系統（含自我分析）並可附提問；價格為一個系統 1 點、兩個以上為各系統基本價之和 × 1.2 無條件捨去且上限 30；請求帶 Idempotency-Key（即報告 id），重複請求只回報目前狀態且不重複扣點；建立前確保每個系統的單維度報告已保存並記在 sources；所需資料不齊、點數不足、請求無效時在扣點與呼叫 AI 之前拒絕；每人每小時與每日有生成次數上限；訪客不可取得"
    appliesTo: ["AGG-025", "AGG-008"]
    useCases: ["UC-054", "UC-056"]
  - id: RULE-095
    description: "使用者的提問是唯一進入 prompt 的自由文字，以資料而非指令處理：100 字內、前後空白去除、空白視為沒有；系統 prompt 聲明提問不得改變 AI 的角色、輸出格式或任何規則，無關或違規的要求一律忽略；提問隨報告保存並隨報告到期、刪除"
    appliesTo: ["AGG-025"]
    useCases: ["UC-054"]
  - id: RULE-096
    description: "AI 報告的輸出須通過品質檢查才可顯示：章節依固定順序且只在有提問時才有回應提問；開頭與每一條列夠長、條列數量符合章節規格；不含診斷或醫療字眼、生死或壽命的預言、百分比；只引用規則真的找到的洞見，且兩個以上系統時「值得注意的點」至少引用一條；違反即視為生成失敗並退點，絕對語氣只計為警告"
    appliesTo: ["AGG-025"]
    useCases: ["UC-054"]
  - id: RULE-097
    description: "導師視角與內容界線（CTX-CON-030）：AI 以融合心理學、命相學、神秘學專家視角的同一位導師，縱觀過去、現在、未來的狀態、可能發生的事件類型與提醒；談未來只說可能與傾向，不給確切日期、人名或結果，不下吉凶斷言，不預言壽命、疾病、婚姻成敗或財運，不做診斷，不給醫療、法律、財務建議；交給 AI 的內容只含今天的日期、各來源報告的事實與面向、洞見候選與提問，不含使用者 id 或電子郵件；prompt 版本隨報告保存"
    appliesTo: ["AGG-025"]
    useCases: ["UC-054"]
  - id: RULE-098
    description: "AI 報告的骨架：事實攤開（每份來源報告只列標題與一句摘要，由系統取自該報告、不由 AI 撰寫、AI 完成前就存在）→ 值得注意的點 → 共同的優勢 → 共同的劣勢與需要留意的地方 → 過去 → 現在 → 未來 → 回應你的提問（有提問才有）→ 結論與提醒；除過去與現在外每一部分是一段開頭加條列；共同的優勢與劣勢取各份報告共同指向的；回應提問先給直接的回答再展開條列；結論條列具體可執行的提醒"
    appliesTo: ["AGG-025"]
    useCases: ["UC-054", "UC-055"]
  - id: RULE-099
    description: "兩個以上系統時，規則把各系統放進同一套特質本體找出跨系統洞見，只作為 AI 的輸入素材（洞見候選），不保存為報告也不單獨呈現；找不到任何洞見回 NO_INSIGHTS 且不扣點，不產生報告"
    appliesTo: ["AGG-025", "AGG-023"]
    useCases: ["UC-054"]
  - id: RULE-100
    description: "AI 報告存於使用者自己的集合，僅本人可讀（他人、不存在或已到期都回找不到）；保存 6 個月（建立時間加 6 個月），由每日到期作業清除，不開 Firestore TTL；刪除帳號與刪除資料的「報告」範圍清除全部 AI 報告，其他範圍不動；報告自足，來源報告被清除後仍可閱讀；再問一次新增一份而不覆蓋舊報告；舊快照的 ai、aiJob 欄位不再寫入、不遷移"
    appliesTo: ["AGG-025"]
    useCases: ["UC-055", "UC-052"]
  - id: RULE-101
    description: "AI 報告失敗時，在同一交易內標為失敗、記下原因並退回所扣點數，且只退一次；生成中而逾時（工作程序消失）的報告在被讀取（列表或單份）時標為失敗並退點；失敗的報告保留在列表並可帶原來源與原問題再問一次"
    appliesTo: ["AGG-025", "AGG-008"]
    useCases: ["UC-054", "UC-055"]
