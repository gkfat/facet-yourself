        "403":
          "$ref": "#/components/responses/Forbidden"
  "/admin/users":
    get:
      operationId: adminListUsers
      summary: "後台：會員列表"
      description: "僅限超級管理員（admin claim、email 已驗證、Google 登入）。以 cursor 分頁，新註冊在前；帶 email 時只查該完整 email，不分頁。"
      tags: [Admin]
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
        - name: cursor
          in: query
          schema:
            type: string
        - name: email
          in: query
          schema:
            type: string
            format: email
      responses:
        "200":
          description: "會員列表與下一頁 cursor"
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        uid: { type: string }
                        email: { type: string }
                        createdAt: { type: integer }
                        lastSignInAt: { type: integer, nullable: true }
                        disabled: { type: boolean }
                        pointBalance: { type: integer, nullable: true }
                        multiReportCount: { type: integer, nullable: true }
                  nextCursor: { type: string, nullable: true }
        "400":
          description: "參數無效"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
  "/admin/users/{id}":
    get:
      operationId: adminGetUserDetail
      summary: "後台：查看會員詳細資訊"
      description: "僅限超級管理員。回傳該會員的列表欄位、個人資料（生日、星座、出生時間地點、性別、血型、MBTI）與使用狀況（點數、多維度報告、單維度報告快照、塔羅／盧恩／卦象紀錄筆數）；不含測驗作答或報告內容。每次查看記錄管理員與對象（不記內容），回應 private、no-store。單一計數讀取失敗為 null。會員不存在回 404。"
      tags: [Admin]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: "會員詳細資訊"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AdminUserDetail"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
    patch:
      operationId: adminSetUserDisabled
      summary: "後台：停用或啟用會員"
      description: "僅限超級管理員。停用會撤銷 refresh token；不可停用自己。"
      tags: [Admin]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [disabled]
              properties:
                disabled: { type: boolean }
      responses:
        "200":
          description: "已更新"
          content:
            application/json:
              schema:
                type: object
                properties:
                  uid: { type: string }
                  disabled: { type: boolean }
        "400":
          description: "請求無效，或嘗試停用自己"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
    delete:
      operationId: adminDeleteUser
      summary: "後台：刪除已停用的會員"
      description: "僅限超級管理員。沿用帳號刪除流程；未停用的會員與管理員自己不可刪除。"
      tags: [Admin]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: "已刪除"
          content:
            application/json:
              schema:
                type: object
                properties:
                  uid: { type: string }
                  deleted: { type: boolean }
        "400":
          description: "會員尚未停用，或嘗試刪除自己"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
