    get:
      operationId: adminDashboardAiReports
      summary: "後台：多維度 AI 報告使用狀況"
      description: "僅限超級管理員。依台北日期統計成功與失敗次數、各報告使用的維度數與最大值，並列出使用者的提問（不含使用者身分）；只讀取最近的一批報告。"
