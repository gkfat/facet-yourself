        - "$ref": "#/components/parameters/GuestSessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/ShareCardRequest"
      responses:
        "200":
          description: "分享卡"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ShareCard"
        "400":
          "$ref": "#/components/responses/ValidationError"
        "404":
          "$ref": "#/components/responses/NotFound"
  "/account/data":
    delete:
      operationId: deleteAccountData
      summary: "刪除我的資料"
      description: "依 scopes 刪除所選範圍（測驗結果、summary、報告、人類圖），不影響點數與付款。需明確確認。"
      tags: [Account]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/DeleteDataRequest"
      responses:
        "200":
          description: "已刪除"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/DeleteResult"
        "401":
          "$ref": "#/components/responses/Unauthorized"
  "/account":
    delete:
      operationId: deleteAccount
      summary: "刪除我的帳號"
      description: "刪除該使用者的全部紀錄（含付款），僅保留贈點紀錄（RULE-024、RULE-031）；同一 Google 帳號再登入視為全新帳號（RULE-029）。未用點數無法再使用且不退款。"
      tags: [Account]
      responses:
        "200":
          description: "已刪除"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/DeleteResult"
        "401":
          "$ref": "#/components/responses/Unauthorized"
  "/admin/fixed-contents":
    get:
