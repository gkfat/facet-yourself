        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: "Firebase ID token"
      description: "Google 登入後取得的 Firebase ID token，後端驗證。Admin 路徑另需 editor／operator 角色 claim。"
    guestSession:
      type: apiKey
      in: header
      name: X-Guest-Session-Id
      description: "訪客暫存 session id（不可猜測，TTL 1 天）"
    webhookSignature:
      type: apiKey
      in: header
      name: X-Webhook-Signature
      description: "付款服務簽章（實際標頭依供應商）"
    cronSecret:
      type: http
      scheme: bearer
      description: "Vercel Cron 帶入的 CRON_SECRET"
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: "防止重複扣點／重複生成（RULE-025、NFR-017）"
      schema:
        type: string
    GuestSessionId:
      name: X-Guest-Session-Id
      in: header
      required: false
      description: "未登入時用以暫存當次結果"
      schema:
        type: string
    SessionIdPath:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
    ReportIdPath:
      name: reportId
      in: path
      required: true
      schema:
        type: string
    AssessmentIdPath:
      name: assessmentId
      in: path
      required: true
      schema:
        type: string
        enum: [enneagram, hexaco, via-strengths, riasec, emotional-intelligence, attachment-style, core-values, psychological-needs]
    SnapshotIdPath:
      name: snapshotId
      in: path
      required: true
      schema:
        type: string
  responses:
    ValidationError:
      description: "請求格式或欄位無效，或違反業務規則（details 指出 RULE）"
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: "未登入或 token 無效"
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
    Forbidden:
      description: "無權限（非擁有者或角色不足）"
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
    NotFound:
      description: "資源不存在或已到期刪除"
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
    InsufficientPoints:
      description: "點數不足或已過期"
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
    RateLimited:
      description: "超過頻率限制"
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
    ConfirmationRequired:
      description: "需使用者確認（例如報告已下載過，重複下載將再扣 1 點），details 含上次下載時間"
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
  schemas:
    ErrorResponse:
      type: object
      description: "統一錯誤格式；違反業務規則時 code 對應 RULE。"
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true
      required: [code, message]
    Zodiac:
      type: string
      enum: [aries, taurus, gemini, cancer, leo, virgo, libra, scorpio, sagittarius, capricorn, aquarius, pisces]
    BloodType:
      type: string
      enum: [A, B, O, AB, UNKNOWN]
    Gender:
      type: string
      description: "選填；只用來決定八字大運的排法（男命、女命順逆不同），不用於其他分析或顯示"
      enum: [MALE, FEMALE]
    MbtiType:
      type: string
      enum: [INTJ, INTP, ENTJ, ENTP, INFJ, INFP, ENFJ, ENFP, ISTJ, ISFJ, ESTJ, ESFJ, ISTP, ISFP, ESTP, ESFP]
    HumanDesignType:
      type: string
      enum: [generator, manifesting_generator, projector, manifestor, reflector]
    ContentType:
      type: string
      enum: [SUMMARY, ZODIAC, BLOOD, MBTI, NUMEROLOGY, ASSESSMENT]
    ContentStatus:
      type: string
      enum: [DRAFT, REVIEWED, PUBLISHED]
    BirthData:
      type: object
      properties:
        birthDate:
          type: string
          format: date
        zodiac:
          "$ref": "#/components/schemas/Zodiac"
        birthTime:
          type: string
          pattern: "^([01]\\d|2[0-3]):[0-5]\\d$"
          nullable: true
        birthPlace:
          type: string
          description: "預設城市清單的代碼（含經緯度與時區），由前端選單提供"
          nullable: true
      required: [birthDate, zodiac]
    ProfileInput:
      type: object
      properties:
        birthData:
          "$ref": "#/components/schemas/BirthData"
        bloodType:
          "$ref": "#/components/schemas/BloodType"
        mbti:
          "$ref": "#/components/schemas/MbtiType"
          nullable: true
        gender:
          "$ref": "#/components/schemas/Gender"
          nullable: true
      required: [birthData]
    Profile:
      type: object
      properties:
        userId:
          type: string
        email:
          type: string
        birthData:
          "$ref": "#/components/schemas/BirthData"
        bloodType:
          "$ref": "#/components/schemas/BloodType"
        mbti:
          "$ref": "#/components/schemas/MbtiType"
          nullable: true
        gender:
          "$ref": "#/components/schemas/Gender"
          nullable: true
      required: [userId, birthData]
    LoginRequest:
      type: object
      properties:
        idToken:
          type: string
      required: [idToken]
    LoginResponse:
      type: object
      properties:
        userId:
          type: string
        email:
          type: string
        isNewUser:
          type: boolean
        welcomePointsGranted:
          type: integer
      required: [userId, isNewUser, welcomePointsGranted]
    GuestSession:
      type: object
      properties:
        sessionId:
          type: string
        expiresAt:
          type: string
          format: date-time
      required: [sessionId, expiresAt]
    ClaimResult:
      type: object
      properties:
        savedAttempts:
          type: integer
      required: [savedAttempts]
    FixedResultContent:
      type: object
      properties:
        contentType:
          "$ref": "#/components/schemas/ContentType"
        key:
          type: string
        title:
          type: string
        summary:
          type: string
        strengths:
          type: array
          items:
            type: string
        blindSpots:
          type: array
          items:
            type: string
        loveStyle:
          type: string
        workStyle:
          type: string
        communicationStyle:
          type: string
        growthAdvice:
          type: string
        disclaimer:
          type: string
        contentVersion:
          type: string
      required: [contentType, key, title, summary, disclaimer, contentVersion]
    FixedContentBody:
      type: object
      properties:
        title:
          type: string
        summary:
          type: string
        strengths:
          type: array
          items:
            type: string
        blindSpots:
          type: array
          items:
            type: string
        loveStyle:
          type: string
        workStyle:
          type: string
        communicationStyle:
          type: string
        growthAdvice:
          type: string
        disclaimer:
          type: string
      required: [title, summary, disclaimer]
    FixedContentItem:
      type: object
      properties:
        contentType:
          "$ref": "#/components/schemas/ContentType"
        key:
          type: string
        body:
          "$ref": "#/components/schemas/FixedContentBody"
        contentVersion:
          type: string
        status:
          "$ref": "#/components/schemas/ContentStatus"
      required: [contentType, key, contentVersion, status]
    ContentCoverage:
      type: object
      properties:
        expectedSummaryCombinations:
          type: integer
          example: 960
        publishedSummaryCombinations:
          type: integer
        missing:
          type: array
          items:
            "$ref": "#/components/schemas/CombinationKey"
      required: [expectedSummaryCombinations, publishedSummaryCombinations, missing]
    TestSummary:
      type: object
      properties:
        testId:
          type: string
        title:
          type: string
        version:
          type: string
        questionCount:
          type: integer
      required: [testId, title, version]
    Question:
      type: object
      properties:
        questionId:
          type: string
        text:
          type: string
        options:
          type: array
          items:
            type: object
            properties:
              value:
                type: string
              label:
                type: string
            required: [value, label]
      required: [questionId, text, options]
    Test:
      type: object
      properties:
        testId:
          type: string
        title:
          type: string
        version:
          type: string
        questions:
          type: array
          items:
            "$ref": "#/components/schemas/Question"
      required: [testId, version, questions]
    Answer:
      type: object
      properties:
        questionId:
          type: string
        value:
          oneOf:
            - type: string
            - type: number
        responseTimeMs:
          type: integer
          minimum: 0
          nullable: true
      required: [questionId, value]
    TestSubmissionRequest:
      type: object
      properties:
        testVersion:
          type: string
        answers:
          type: array
          items:
            "$ref": "#/components/schemas/Answer"
          minItems: 1
        responseTimeConsent:
          type: boolean
          description: "使用者已被告知並同意蒐集作答時間"
      required: [testVersion, answers]
    TestSubmissionResponse:
      type: object
      properties:
        attemptId:
          type: string
          nullable: true
        testVersion:
          type: string
        result:
          "$ref": "#/components/schemas/MbtiType"
        content:
          "$ref": "#/components/schemas/FixedResultContent"
        persisted:
          type: boolean
          description: "訪客為 false（僅暫存 1 天）"
        expiresAt:
          type: string
          format: date-time
          nullable: true
      required: [testVersion, result, content, persisted]
    TestAttempt:
      type: object
      properties:
        attemptId:
          type: string
        testId:
          type: string
        testVersion:
          type: string
        result:
          "$ref": "#/components/schemas/MbtiType"
        completedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
      required: [attemptId, testId, testVersion, result, completedAt, expiresAt]
    CombinationKey:
      type: object
      description: "多維度分析用到的維度；沒選的維度為 null"
      properties:
        zodiac:
          "$ref": "#/components/schemas/Zodiac"
          nullable: true
        mbti:
          "$ref": "#/components/schemas/MbtiType"
          nullable: true
        bloodType:
          "$ref": "#/components/schemas/BloodType"
          nullable: true
        humanDesignType:
          "$ref": "#/components/schemas/HumanDesignType"
          nullable: true
        numerology:
          type: string
          nullable: true
          description: "生命靈數（1–9、11、22、33）；未選入此組合時為 null"
      required: [zodiac, mbti]
    GuestProfile:
      type: object
      properties:
        birthData:
          type: object
          nullable: true
          additionalProperties: true
        bloodType:
          type: string
          enum: [A, B, O, AB, UNKNOWN]
        mbti:
          type: string
          nullable: true
        gender:
          "$ref": "#/components/schemas/Gender"
          nullable: true
        hasHumanDesign:
          type: boolean
      required: [birthData, bloodType, mbti, gender, hasHumanDesign]
    NatalChartRequest:
      type: object
      properties:
        birthDate:
          type: string
          format: date
        birthTime:
          type: string
          pattern: "^([01]\\d|2[0-3]):[0-5]\\d$"
        birthPlace:
          type: string
          description: "預設城市清單的代碼"
      required: [birthDate, birthTime, birthPlace]
    NatalChartPlacement:
      type: object
      properties:
        sign:
          type: string
          enum: [aries, taurus, gemini, cancer, leo, virgo, libra, scorpio, sagittarius, capricorn, aquarius, pisces]
        degree:
          type: integer
          minimum: 0
          maximum: 29
      required: [sign, degree]
    NatalChart:
      type: object
      properties:
        ascendant:
          "$ref": "#/components/schemas/NatalChartPlacement"
        bodies:
          type: object
          properties:
            SUN:
              "$ref": "#/components/schemas/NatalChartPlacement"
            MOON:
              "$ref": "#/components/schemas/NatalChartPlacement"
            MERCURY:
              "$ref": "#/components/schemas/NatalChartPlacement"
            VENUS:
              "$ref": "#/components/schemas/NatalChartPlacement"
            MARS:
              "$ref": "#/components/schemas/NatalChartPlacement"
            JUPITER:
              "$ref": "#/components/schemas/NatalChartPlacement"
            SATURN:
              "$ref": "#/components/schemas/NatalChartPlacement"
            URANUS:
              "$ref": "#/components/schemas/NatalChartPlacement"
            NEPTUNE:
              "$ref": "#/components/schemas/NatalChartPlacement"
            PLUTO:
              "$ref": "#/components/schemas/NatalChartPlacement"
        timeNote:
          type: string
          nullable: true
          enum: [AMBIGUOUS, NONEXISTENT]
      required: [ascendant, bodies, timeNote]
    BaziRequest:
      type: object
      properties:
        birthDate:
          type: string
          format: date
          description: "真實且不在未來的日期"
        birthTime:
          type: string
          pattern: "^([01]\\d|2[0-3]):[0-5]\\d$"
          nullable: true
          description: "出生地的當地時間；沒有時只算三柱"
        birthPlace:
          type: string
          nullable: true
          description: "預設城市清單的代碼；沒有時以 Asia/Taipei 計算"
        gender:
          "$ref": "#/components/schemas/Gender"
          nullable: true
          description: "只用來決定大運的排法；沒有時不輸出大運與流年"
      required: [birthDate]
    BaziPillar:
      type: object
      properties:
        stem:
          type: string
          description: "天干"
        branch:
          type: string
          description: "地支"
      required: [stem, branch]
    BaziFlowYear:
      type: object
      properties:
        year:
          type: integer
        pillar:
          "$ref": "#/components/schemas/BaziPillar"
        tenGod:
          type: string
          description: "對日干的十神"
      required: [year, pillar, tenGod]
    BaziChart:
      type: object
      properties:
        timeZone:
          type: string
        timeZoneAssumed:
          type: boolean
          description: "沒有提供出生城市而以預設時區計算"
        hasTime:
          type: boolean
        baziYear:
          type: integer
          description: "年柱所屬的年（立春之前為前一年）"
        pillars:
          type: object
          properties:
            year:
              "$ref": "#/components/schemas/BaziPillar"
            month:
              "$ref": "#/components/schemas/BaziPillar"
            day:
              "$ref": "#/components/schemas/BaziPillar"
            hour:
              "$ref": "#/components/schemas/BaziPillar"
              nullable: true
          required: [year, month, day, hour]
        dayMaster:
          type: object
          properties:
            stem:
              type: string
            element:
              type: string
              enum: [wood, fire, earth, metal, water]
            polarity:
              type: string
              enum: [YANG, YIN]
          required: [stem, element, polarity]
        chart:
          type: array
          description: "每柱的十神、五行與藏干（含藏干的十神）"
          items:
            type: object
            additionalProperties: true
        elementCounts:
          type: object
          description: "八個字（三柱為六個）的五行數量，不加權"
          additionalProperties:
            type: integer
        tenGodCounts:
          type: object
          additionalProperties:
            type: integer
        groupCounts:
          type: object
          description: "比劫 peer、食傷 output、財 wealth、官殺 power、印 resource"
          additionalProperties:
            type: integer
        facts:
          type: object
          description: "地勢與自坐、空亡、納音、命宮與胎元、生肖、節氣與季節、合沖關係；只列事實，不附吉凶"
          additionalProperties: true
        strength:
          type: object
          description: "幫扶分、強弱分級、五行旺衰、命格與喜用神（以十神類別表示；中和時 useful 為 null）"
          additionalProperties: true
        bone:
          type: object
          nullable: true
          description: "稱骨骨重；沒有出生時間時為 null"
          additionalProperties: true
        lateZi:
          type: boolean
        borderline:
          type: array
          description: "距離節或時辰界線 30 分鐘內的交界提示"
          items:
            type: object
            additionalProperties: true
        termDay:
          type: object
          nullable: true
          description: "沒有時間且出生日剛好有節時，月柱（或年柱）可能不同"
          additionalProperties: true
        luckStatus:
          type: string
          enum: [OK, NEEDS_GENDER, NEEDS_TIME]
        luck:
          type: object
          nullable: true
          description: "大運：順逆、起運歲數、8 步大運（含起訖歲數與年份、十神）、目前的大運與各步的十個流年"
          additionalProperties: true
        flowYears:
          type: array
          nullable: true
          description: "今年（立春換年）與接下來 4 年；沒有性別時為 null"
          items:
            "$ref": "#/components/schemas/BaziFlowYear"
        interpretation:
          type: object
          description: "事先寫好的固定內容（日主、五行、十神群組、月令、強弱、命格、喜用神、稱骨、目前的大運）"
          additionalProperties: true
      required: [timeZone, timeZoneAssumed, hasTime, baziYear, pillars, dayMaster, chart, elementCounts, tenGodCounts, groupCounts, facts, strength, bone, lateZi, borderline, termDay, luckStatus, luck, flowYears, interpretation]
    HumanDesignRequest:
      type: object
      properties:
        birthDate:
          type: string
          format: date
        birthTime:
          type: string
          pattern: "^([01]\\d|2[0-3]):[0-5]\\d$"
        birthPlace:
          type: string
          description: "預設城市清單的代碼"
      description: "三個欄位皆選填：未提供的部分取自已儲存的個人資料（會員）或訪客 session 的個人資料；補齊後仍缺出生時間或地點回傳 422（BIRTH_TIME_REQUIRED／BIRTH_PLACE_REQUIRED）。"
    HumanDesignResult:
      type: object
      properties:
        type:
          "$ref": "#/components/schemas/HumanDesignType"
        strategy:
          type: string
          enum: [INFORM, RESPOND, WAIT_FOR_INVITATION, WAIT_A_LUNAR_CYCLE]
        authority:
          type: string
          enum: [EMOTIONAL, SACRAL, SPLENIC, EGO, SELF_PROJECTED, MENTAL, LUNAR]
        profile:
          type: string
          example: "1/3"
        definition:
          type: string
          enum: [NONE, SINGLE, SPLIT, TRIPLE_SPLIT, QUADRUPLE_SPLIT]
        incarnationCross:
          type: object
          properties:
            angle:
              type: string
              enum: [RIGHT_ANGLE, JUXTAPOSITION, LEFT_ANGLE]
            gates:
              type: array
              description: "人格太陽/地球、設計太陽/地球四個閘門"
              items:
                type: integer
          required: [angle, gates]
        definedCenters:
          type: array
          items:
            type: string
            enum: [HEAD, AJNA, THROAT, G, HEART, SACRAL, SPLEEN, SOLAR_PLEXUS, ROOT]
        channels:
          type: array
          items:
            type: array
            items:
              type: integer
        personality:
          type: array
          description: "出生時的 13 個天體閘門與線（意識）"
          items:
            "$ref": "#/components/schemas/HumanDesignActivation"
        design:
          type: array
          description: "出生前太陽弧 88 度的 13 個天體閘門與線（潛意識）"
          items:
            "$ref": "#/components/schemas/HumanDesignActivation"
        disclaimer:
          type: string
        saved:
          type: boolean
          description: "會員為 true（保存 3 個月）；訪客為 true 表示暫存於 session"
        expiresAt:
          type: integer
          nullable: true
      required: [type, strategy, authority, profile, definition, incarnationCross, disclaimer, saved]
    HumanDesignActivation:
      type: object
      properties:
        body:
          type: string
        gate:
          type: integer
          minimum: 1
          maximum: 64
        line:
          type: integer
          minimum: 1
          maximum: 6
      required: [body, gate, line]
    PointBatch:
      type: object
      properties:
        batchId:
          type: string
        source:
          type: string
          enum: [WELCOME, PURCHASE]
        granted:
          type: integer
        remaining:
          type: integer
        expiresAt:
          type: string
          format: date-time
          nullable: true
      required: [batchId, source, remaining]
    PointBalance:
      type: object
      properties:
        availableBalance:
          type: integer
        batches:
          type: array
          items:
            "$ref": "#/components/schemas/PointBatch"
      required: [availableBalance, batches]
    PointTransaction:
      type: object
      properties:
        transactionId:
          type: string
        type:
          type: string
          enum: [GRANT, PURCHASE, DEDUCT, REFUND]
        amount:
          type: integer
        reason:
          type: string
          enum: [WELCOME, SUMMARY, DETAILED_REPORT, REGENERATE, DOWNLOAD, PURCHASE]
        reference:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
      required: [transactionId, type, amount, reason, createdAt]
    PointTransactionList:
      type: object
      properties:
        items:
          type: array
          items:
            "$ref": "#/components/schemas/PointTransaction"
        nextCursor:
          type: string
          nullable: true
      required: [items]
    Money:
      type: object
      properties:
        amount:
          type: number
        currency:
          type: string
      required: [amount, currency]
    HomePreviewItem:
      type: object
      nullable: true
      description: "標題與一句摘要；內容尚未發佈或未被要求時為 null"
      properties:
        title:
          type: string
        summary:
          type: string
    HomePreview:
      type: object
      properties:
        zodiac:
          "$ref": "#/components/schemas/HomePreviewItem"
        numerology:
          "$ref": "#/components/schemas/HomePreviewItem"
    PointPackage:
      type: object
      properties:
        packageId:
          type: string
        points:
          type: integer
        price:
          "$ref": "#/components/schemas/Money"
        validityDays:
          type: integer
          description: "null 代表無限期"
          nullable: true
      required: [packageId, points, price]
    CreatePaymentRequest:
      type: object
      properties:
        packageId:
          type: string
        acceptDigitalContentTerms:
