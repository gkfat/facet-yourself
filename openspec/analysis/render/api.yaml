                        outputTokens: { type: integer }
                  month:
                    type: object
                    properties:
                      cost: { type: number }
                      inputTokens: { type: integer }
                      outputTokens: { type: integer }
                  usdToTwdRate: { type: number }
        "400":
          description: "參數無效"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
