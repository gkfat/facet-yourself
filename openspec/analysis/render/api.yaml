      description: "每會員每台北日期可計算一次，計算即解鎖、不扣點（RULE-039）；已解鎖則回傳既有結果。Kin 以 Dreamspell 曆法計算，2/29 沿用 2/28（RULE-040）。內容為今日 Kin 專用的 260 筆（RULE-041），尚未發佈回 404 且不寫入紀錄。"
      tags: [Today]
      responses:
        "200":
          description: "已解鎖的今日 Kin（新解鎖或既有）"
          content:
            application/json:
