            application/json:
              schema:
                "$ref": "#/components/schemas/FixedContentItem"
        "400":
          "$ref": "#/components/responses/ValidationError"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
  "/admin/fixed-contents/{contentType}/{key}/publication":
