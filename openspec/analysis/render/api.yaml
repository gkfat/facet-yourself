            application/json:
              schema:
                "$ref": "#/components/schemas/ReportSnapshotDetail"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "404":
          "$ref": "#/components/responses/NotFound"
  "/report-snapshots/{snapshotId}/export":
    post:
      operationId: exportReportSnapshotPdf
      summary: "下載報告快照 PDF"
      description: "【尚未實作】把已保存的報告快照（含已有的 AI 分析）產生為 PDF 供下載，不重新呼叫 AI（RULE-032）；僅擁有者、快照未到期；每次下載扣 1 點（CTX-ASM-028 沿用原規則，未重新確認）；快照曾下載過時回 409 並附上次下載時間，須帶 confirmRepeat: true 重送才會再扣點；需 Idempotency-Key；失敗退點。"
      tags: [ReportSnapshots]
      parameters:
        - "$ref": "#/components/parameters/SnapshotIdPath"
        - "$ref": "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                confirmRepeat:
                  type: boolean
                  description: "曾下載過時，使用者已確認要重複下載（會再扣 1 點）"
      responses:
        "200":
          description: "PDF 檔"
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "402":
          "$ref": "#/components/responses/InsufficientPoints"
        "404":
          "$ref": "#/components/responses/NotFound"
        "409":
          description: "快照曾下載過，需確認才重複下載（回應含上次下載時間）"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
  "/single-reports":
    post:
      operationId: createSingleReport
      summary: "取得單維度報告"
      description: "以固定規則與已審的固定內容組裝一個系統的報告：位置結論、系統的事實與解讀、本系統的歸納、影響地圖、建議與反思、依據與限制。免費、不呼叫 AI、不扣點。已登入者的報告保存為快照，相同的報告只保存一份（重複請求回傳既有的）；訪客帶 X-Guest-Session-Id，依其暫存的資料組裝，不保存任何東西（persisted 為 false，id 與 expiresAt 為 null）。缺資料回 422（PROFILE_REQUIRED、BLOOD_REQUIRED、MBTI_REQUIRED），內容尚未發佈回 404。"
      tags: [ReportSnapshots]
      security:
        - bearerAuth: []
        - guestSession: []
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                system:
                  type: string
                  enum: [ZODIAC, BLOOD, NUMEROLOGY, MBTI, MAYA_KIN, BAZI, HUMAN_DESIGN, TAROT, RUNE, HOROSCOPE]
              required: [system]
      responses:
        "200":
          description: "報告（已登入者為保存的快照；訪客為即時組裝、不保存）"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SingleReport"
        "400":
          "$ref": "#/components/responses/ValidationError"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "404":
          "$ref": "#/components/responses/NotFound"
        "422":
          description: "缺少報告需要的資料（PROFILE_REQUIRED、BLOOD_REQUIRED、MBTI_REQUIRED）"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
  "/rune/daily":
    get:
      operationId: getDailyRune
      summary: "查詢今日盧恩"
      description: "回傳今日是否已抽符；已抽則含符文、正逆位與固定內容。不寫入紀錄。"
      tags: [Today]
      responses:
        "200":
          description: "今日盧恩狀態"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/DailyRuneState"
        "401":
          "$ref": "#/components/responses/Unauthorized"
    post:
      operationId: drawDailyRune
      summary: "抽今日盧恩"
      description: "Elder Futhark 24 枚；僅 15 枚方向可辨識的符文可為逆位，Gebo、Hagalaz、Nauthiz、Isa、Jera、Eihwaz、Sowilo、Ingwaz、Dagaz 只有正位（RULE-037）。同帳號同日只有一筆，已抽過回傳既有結果（RULE-035）。免費、不呼叫 AI。內容尚未發佈回 404 且不寫入紀錄。"
      tags: [Today]
      responses:
        "200":
          description: "今日盧恩（新抽出或既有）"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/DailyRuneState"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "404":
          "$ref": "#/components/responses/NotFound"
  "/hexagram/daily":
    get:
      operationId: getDailyHexagram
      summary: "查詢今日卦象"
      description: "會員：回傳今日已起的各卦（依序號），含六爻、本卦、變卦、讀法與固定內容，以及下一卦的點數（第一卦 0、之後 1）；尚未起卦則 drawn 為 false。訪客：只回日期與 drawn 為 false（訪客不保存紀錄）。唯讀，不寫入。"
      tags: [Today]
      responses:
        "200":
          description: "今日卦象狀態"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/DailyHexagramState"
        "401":
          "$ref": "#/components/responses/Unauthorized"
    post:
      operationId: castDailyHexagram
      summary: "起卦"
      description: "三枚銅錢法，由伺服器依對象、台北日期、當日序號與規則版本決定性產生六爻。會員當日第一卦免費；之後每卦 1 點，且須帶 confirmCharge 才會扣點（未帶則回傳最新一卦、不扣點）；requestId 為冪等鍵，同一鍵重送回傳同一卦。訪客只有當日免費的一卦、不寫紀錄，帶 confirmCharge 回 401。請求只接受 requestId 與 confirmCharge。內容尚未發佈回 404，且不寫紀錄、不扣點；點數不足回 402。"
      tags: [Today]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/HexagramCastRequest"
      responses:
        "200":
          description: "新起的一卦或既有的一卦"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/HexagramCastResponse"
        "400":
          "$ref": "#/components/responses/ValidationError"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "402":
          "$ref": "#/components/responses/InsufficientPoints"
        "404":
          "$ref": "#/components/responses/NotFound"
  "/fortune/history":
    get:
      operationId: getFortuneHistory
      summary: "查詢歷史運勢"
      description: "僅會員。回傳最近 3 個月（台北日期，起點為今天往前推 3 個月）每天抽到的塔羅、盧恩與易經卦象（一天可多卦，依序號），由新到舊、以有紀錄的日期分頁，每頁最多 14 天，每項帶當時的固定內容（內容已下架時為 null，紀錄仍保留）。before 為游標（只回該日期之前，須為合法日期、不晚於今天、不早於窗口起點），limit 預設與上限皆 14，其他參數與超出範圍回驗證錯誤。不含瑪雅 Kin 與星座運勢；卦象依入口開關納入。卦象讀取達上限時 truncated 為 true。唯讀、不寫入、不扣點、不呼叫 AI，回應 private、no-store。"
      tags: [Today]
      parameters:
        - name: before
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 14
            default: 14
      responses:
        "200":
          description: "一頁歷史運勢"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/FortuneHistoryState"
        "400":
          "$ref": "#/components/responses/ValidationError"
        "401":
          "$ref": "#/components/responses/Unauthorized"
  "/kin/today":
    get:
      operationId: getTodayKin
      summary: "查詢今日瑪雅 Kin"
      description: "回傳今日是否已解鎖；已解鎖則含 Kin 與固定內容，解鎖後當日可不限次數查看（RULE-039）。未解鎖時不回傳 Kin 內容。"
