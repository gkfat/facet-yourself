          "$ref": "#/components/responses/Forbidden"
  "/cron/data-expiry":
    get:
      operationId: runDataExpiry
      summary: "排程清除到期資料"
      description: "由 Vercel Cron 呼叫，以 CRON_SECRET 驗證；刪除滿 3 個月的測驗結果、多維度分析報告、MBTI 欄位與人類圖結果，以及滿 6 個月的詳細分析，不影響付款紀錄。"
      tags: [Operations]
      security:
        - cronSecret: []
      responses:
        "200":
          description: "清除結果"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CronResult"
        "401":
          "$ref": "#/components/responses/Unauthorized"
  "/human-design":
    get:
      operationId: getHumanDesign
      summary: "取得我已儲存的人類圖"
      description: "讀取已儲存的人類圖結果，不重新計算。尚未計算過回傳 404。"
      tags: [HumanDesign]
      responses:
        "200":
          description: "人類圖結果"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/HumanDesignResult"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "404":
          "$ref": "#/components/responses/NotFound"
  "/today":
    get:
      operationId: getTodayStatus
      summary: "「此刻／今日」區塊的當日狀態"
      description: "回傳台北今日各項的狀態（塔羅已抽否、盧恩已抽否、今日 Kin 已解鎖否、今日即時星象報告是否存在及其狀態），供首頁區塊顯示；只回傳狀態與簡短識別，不含固定內容全文。日期由伺服器以 Asia/Taipei 計算，不接受客戶端日期（RULE-038）。訪客不可使用（RULE-050），前端未登入時只顯示登入提示、不呼叫此端點。"
      tags: [Today]
      responses:
        "200":
          description: "當日狀態"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/TodayStatus"
        "401":
          "$ref": "#/components/responses/Unauthorized"
  "/tarot/daily":
    get:
      operationId: getDailyTarot
      summary: "查詢今日塔羅"
      description: "回傳今日是否已翻牌；已翻則含牌、正逆位與固定內容。不寫入紀錄。以帳號與台北日期決定（RULE-035、RULE-038）。"
      tags: [Today]
      responses:
        "200":
          description: "今日塔羅狀態"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/DailyTarotState"
        "401":
          "$ref": "#/components/responses/Unauthorized"
    post:
      operationId: drawDailyTarot
      summary: "翻今日塔羅"
      description: "同帳號同台北日期只建立一筆紀錄；已翻過則回傳既有結果、不重新計算，可安全重試與並行（RULE-035、NFR-018）。免費、不呼叫 AI（RULE-036）。固定內容尚未發佈時回 404，且不寫入紀錄。結果須附免責說明（RULE-049）。"
      tags: [Today]
      responses:
        "200":
          description: "今日塔羅（新翻開或既有）"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/DailyTarotState"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "404":
          "$ref": "#/components/responses/NotFound"
  "/ai-reports":
    get:
      operationId: listAiReports
      summary: "列出我的 AI 報告"
      description: "只回傳呼叫者自己未到期的 AI 報告卡片（含生成中、完成、失敗已退點），新到舊，最多 100 筆。每筆含 sources（用了哪些單維度報告）與提問（沒提問為 null），不含報告內容；內容以 GET /ai-reports/{id} 讀取。報告保存 3 個月。生成中而逾時的報告在此被標為失敗並退點。"
      tags: [ReportSnapshots]
      responses:
        "200":
          description: "AI 報告卡片清單"
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/AiReportSummary"
        "401":
          "$ref": "#/components/responses/Unauthorized"
    post:
      operationId: createAiReport
      summary: "取得 AI 報告"
      description: "把一個以上的穩定特質系統（星座、血型、MBTI、生命靈數、瑪雅 Kin、八字、人類圖，以及九個自我分析）與選填的提問（100 字內）交給 AI。一個系統 1 點；兩個以上由規則先找跨系統洞見、AI 只拿這些洞見當素材，價格 = 各系統基本價（人類圖 2、八字 3、其餘 1）之和 × 1.2，無條件捨去，上限 30 點。每個系統的單維度報告會先確保已保存並記在 sources。回傳 202 與報告 id，再以 GET /ai-reports 輪詢；失敗退點。缺資料回 422（PROFILE_REQUIRED、BLOOD_REQUIRED、MBTI_REQUIRED、ASSESSMENT_REQUIRED、BIRTH_TIME_REQUIRED、BIRTH_PLACE_REQUIRED），多系統找不到任何洞見回 422（NO_INSIGHTS），皆不扣點。需 Idempotency-Key（即報告 id）。"
      tags: [ReportSnapshots]
      parameters:
        - "$ref": "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/AiReportRequest"
      responses:
        "202":
          description: "已受理（同一個 Idempotency-Key 重複請求只回報目前狀態，不重複扣點）"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AiReportAccepted"
        "400":
          "$ref": "#/components/responses/ValidationError"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "402":
          "$ref": "#/components/responses/InsufficientPoints"
        "422":
          description: "缺少報告需要的資料，或兩個以上系統的規則找不到任何洞見（NO_INSIGHTS）"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        "429":
          "$ref": "#/components/responses/RateLimited"
  "/ai-reports/{id}":
    get:
      operationId: getAiReport
      summary: "查看 AI 報告"
      description: "回傳一份 AI 報告的全文：先是事實攤開（各來源單維度報告的標題與摘要），再是導師的各段（值得注意的點、共同的優勢、共同的劣勢、過去、現在、未來、回應提問（有提問才有）、結論與提醒），每段是一段開頭加條列。僅本人可讀：他人的 id、不存在的 id 與已到期的都回 404。生成中而逾時的報告在此被標為失敗並退點。不呼叫 AI、不扣點。"
      tags: [ReportSnapshots]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: "AI 報告"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AiReportItem"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "404":
          "$ref": "#/components/responses/NotFound"
    delete:
      operationId: deleteAiReport
      summary: "刪除 AI 報告"
      description: "本人刪除自己的一份 AI 報告，無法復原，已扣的點數不退。他人的 id 與不存在的 id 回 404；生成中的報告回 409（等它完成或失敗後才能刪）。"
      tags: [ReportSnapshots]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: "已刪除"
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                required: [id]
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "404":
          "$ref": "#/components/responses/NotFound"
        "409":
          description: "報告還在生成中，暫時不能刪除（code: REPORT_GENERATING）"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
  "/report-snapshots":
    get:
      operationId: listReportSnapshots
      summary: "列出我的報告快照"
      description: "只回傳呼叫者自己未到期的報告，新到舊，不含全文。快照保存 3 個月。"
      tags: [ReportSnapshots]
      responses:
        "200":
          description: "報告快照清單"
