              schema:
                "$ref": "#/components/schemas/TransitReportAccepted"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "402":
          "$ref": "#/components/responses/InsufficientPoints"
        "422":
          description: "缺少出生日期、時間或城市，無法生成"
