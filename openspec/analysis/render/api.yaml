            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/ReportSnapshotItem"
        "401":
          "$ref": "#/components/responses/Unauthorized"
  "/report-snapshots/{snapshotId}":
    get:
      operationId: getReportSnapshot
      summary: "查看報告快照"
      description: "回傳報告產生當時的全文、各段的種類與來源、版本與計算依據。僅本人可讀：他人的 id、不存在的 id 與已到期的都回 404。不呼叫 AI、不扣點。"
      tags: [ReportSnapshots]
      parameters:
        - "$ref": "#/components/parameters/SnapshotIdPath"
      responses:
        "200":
          description: "報告快照"
