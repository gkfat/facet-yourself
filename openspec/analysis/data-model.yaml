store: firestore
storeNotes: "資料庫為 Firestore（CTX-CON-004）；僅由 Nuxt 伺服器端以 Admin SDK 存取，firestore.rules 全擋 client（CTX-CON-013）。以集合／子集合表達「表」，以決定性文件 ID 取代唯一約束。"

tables:
  - id: DATA-001
    name: users
    path: "users/{userId}"
    primaryKey: "userId（Firebase Auth uid）"
    aggregate: AGG-001
    domainModel: ["ENT-001", "VO-001", "VO-002", "VO-003"]
    api: ["API-001", "API-002", "API-003", "API-028", "API-029", "API-006"]
    columns:
      - { name: "userId", type: "string", constraints: "PK；= Firebase uid" }
      - { name: "email", type: "string", constraints: "required" }
      - { name: "birthData", type: "map", constraints: "BirthData 內嵌：birthDate, zodiac, birthTime?, birthPlace?（預設城市清單代碼）；birthDate 與 zodiac 必填（RULE-001）" }
      - { name: "bloodType", type: "string", constraints: "enum A|B|O|AB|UNKNOWN；預設 UNKNOWN" }
      - { name: "mbti", type: "string", constraints: "nullable；16 型之一" }
      - { name: "mbtiExpiresAt", type: "timestamp", constraints: "nullable；MBTI 設定後 3 個月到期，由排程清除 mbti" }
      - { name: "createdAt", type: "timestamp", constraints: "required" }
      - { name: "updatedAt", type: "timestamp", constraints: "required" }
    notes: "帳號的根文件，文件 ID 為 Firebase uid。刪除帳號時整份文件與全部子集合以 recursive delete 移除（RULE-024）；僅保留 DATA-018 贈點紀錄。"
  - id: DATA-002
    name: guestSessions
