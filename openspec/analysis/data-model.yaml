    columns:
      - { name: "contentType", type: "string", constraints: "required；SUMMARY|ZODIAC|BLOOD|MBTI|TAROT|RUNE|KIN_TODAY|KIN_BIRTH|ASSESSMENT" }
      - { name: "key", type: "string", constraints: "required；summary 為組合鍵，單項為對應值；TAROT 為 <牌序 0–21>_<upright|reversed>；RUNE 為 <符文序 0–23>_<upright|reversed>（9 枚對稱符文只有 upright）；KIN_TODAY 與 KIN_BIRTH 為 Kin 1–260；ASSESSMENT 以分析識別碼開頭，例如 enneagram_type-4、riasec_code-IAS，合法金鑰由登錄表（ENT-021）決定" }
      - { name: "combinationKey", type: "map", constraints: "nullable；SUMMARY 才有：zodiac, mbti, bloodType?" }
      - { name: "body", type: "map", constraints: "title, summary, strengths[], blindSpots[], loveStyle, workStyle, communicationStyle, growthAdvice, disclaimer" }
      - { name: "contentVersion", type: "string", constraints: "required" }
      - { name: "status", type: "string", constraints: "required；DRAFT|REVIEWED|PUBLISHED" }
      - { name: "updatedAt", type: "timestamp", constraints: "required" }
      - { name: "publishedAt", type: "timestamp", constraints: "nullable" }
    indexes:
      - { fields: ["contentType ASC", "status ASC"], scope: "COLLECTION", purpose: "後台列表與覆蓋檢查（960 種 summary）" }
    notes: "以決定性文件 ID 保證組合唯一（RULE-021，取代 SQL UNIQUE）；僅 PUBLISHED 可供使用者讀取。含 192 + 768 = 960 筆 summary，另含星座、血型、MBTI 單項內容。自我分析新增 ASSESSMENT 類型（九型、HEXACO、VIA、RIASEC、EQ、依附、價值觀、需求，筆數隨各分析的內容而定，覆蓋預期由登錄表決定）；此次新增 TAROT 44 筆、RUNE 39 筆（24 正位 + 15 逆位）、KIN_TODAY 260 筆、KIN_BIRTH 260 筆，共 603 筆；今日 Kin 與生日 Kin 內容分開撰寫（RULE-041）。"
