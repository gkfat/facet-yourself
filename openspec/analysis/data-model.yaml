      - { fields: ["expiresAt ASC"], scope: "COLLECTION_GROUP", purpose: "排程清除到期資料（UC-017）" }
    notes: "已登入會員的人類圖結果（RULE-028）；保存 3 個月，到期由排程清除（RULE-014）。出生時間與地點的原始值只存在 users.birthData。"
  - id: DATA-017
    status: deprecated
    reason: "刪除帳號改為移除全部紀錄後不再需要 authLinks；userId 回到 Firebase uid"
    name: authLinks
    path: "authLinks/{googleUid}"
    primaryKey: "googleUid（Firebase Auth uid）"
    aggregate: AGG-001
    domainModel: ["ENT-015"]
    api: ["API-001", "API-029"]
    columns:
      - { name: "googleUid", type: "string", constraints: "PK" }
      - { name: "userId", type: "string", constraints: "required；參照 DATA-001" }
      - { name: "linkedAt", type: "timestamp", constraints: "required" }
    notes: "Google 身分與內部 userId 的唯一連結。刪除帳號時刪除此文件，使紀錄無法再回溯到 Google 帳號；同一 Google 帳號再登入時建立新的連結與新 userId（RULE-029）。"
  - id: DATA-018
    name: welcomeGrants
    path: "welcomeGrants/{googleUidHash}"
    primaryKey: "googleUidHash（以伺服器密鑰對 Google uid 做 HMAC-SHA256，不存原始 uid）"
    aggregate: AGG-013
    domainModel: ["ENT-016"]
    api: ["API-001"]
    ttl: { field: "expiresAt", duration: "3 months", rule: "RULE-031" }
    columns:
      - { name: "googleUidHash", type: "string", constraints: "PK" }
      - { name: "grantedAt", type: "timestamp", constraints: "required" }
      - { name: "expiresAt", type: "timestamp", constraints: "required；= grantedAt + 3 個月；Firestore TTL 欄位（RULE-031）" }
    notes: "贈點紀錄獨立於 users，刪除帳號時保留；僅用於避免重複贈點，不作他用。首次登入時於同一 transaction 內檢查是否存在未到期紀錄：存在則不發贈點，不存在則建立帳號、點數帳戶、贈點批次與此紀錄（RULE-031）。"

  - id: DATA-020
    name: tarotDraws
    path: "users/{userId}/tarotDraws/{dateKey}"
    primaryKey: "dateKey（台北日期 YYYY-MM-DD；同會員同日只有一筆，取代 SQL UNIQUE）"
    aggregate: AGG-015
    domainModel: ["ENT-018", "VO-018"]
    api: ["API-041", "API-042", "API-040"]
    columns:
      - { name: "dateKey", type: "string", constraints: "PK；伺服器以 Asia/Taipei 計算（RULE-038）" }
      - { name: "userId", type: "string", constraints: "required" }
      - { name: "symbolIndex", type: "int", constraints: "required；塔羅 0 至 21（VO-018）" }
      - { name: "orientation", type: "string", constraints: "required；UPRIGHT|REVERSED" }
      - { name: "drawVersion", type: "string", constraints: "required；抽取規則版本（例如 tarot-v1），規則改版不影響舊紀錄" }
      - { name: "drawnAt", type: "timestamp", constraints: "required" }
      - { name: "expiresAt", type: "timestamp", constraints: "required；= drawnAt + 3 個月（RULE-047）" }
    indexes:
      - { fields: ["expiresAt ASC"], scope: "COLLECTION_GROUP", purpose: "排程清除到期資料（UC-017）" }
    notes: "以日期為文件 ID，在交易內「不存在才建立」，並行請求只會留下一筆（RULE-035、NFR-018）。牌的內容不複製進來，以 symbolIndex 與 orientation 組成 fixedContents 的金鑰查詢。內容尚未發佈時不寫入（RULE-036）。與既有 add-daily-tarot-draw 的設計一致；供 dataExpiry 與 deletion 清除時須加入 collection group 索引例外清單。"
  - id: DATA-021
    name: runeDraws
    path: "users/{userId}/runeDraws/{dateKey}"
    primaryKey: "dateKey（台北日期；同會員同日只有一筆）"
    aggregate: AGG-015
    domainModel: ["ENT-018", "VO-018"]
    api: ["API-043", "API-044", "API-040"]
    columns:
      - { name: "dateKey", type: "string", constraints: "PK" }
      - { name: "userId", type: "string", constraints: "required" }
      - { name: "symbolIndex", type: "int", constraints: "required；盧恩 0 至 23（Elder Futhark）" }
      - { name: "orientation", type: "string", constraints: "required；UPRIGHT|REVERSED；Gebo、Hagalaz、Nauthiz、Isa、Jera、Eihwaz、Sowilo、Ingwaz、Dagaz 只能是 UPRIGHT（RULE-037）" }
      - { name: "drawVersion", type: "string", constraints: "required" }
      - { name: "drawnAt", type: "timestamp", constraints: "required" }
      - { name: "expiresAt", type: "timestamp", constraints: "required；= drawnAt + 3 個月" }
    indexes:
      - { fields: ["expiresAt ASC"], scope: "COLLECTION_GROUP", purpose: "排程清除到期資料（UC-017）" }
    notes: "與 tarotDraws 同形，都對應 ENT-018，只是分開集合；開發順序晚於塔羅，共用機制待此時才抽出（CTX-CON-019）。若之後決定合併為單一 dailyDraws 集合（加 drawType 欄位），屬資料遷移，需另案決定。"
  - id: DATA-022
    name: kinUnlocks
    path: "users/{userId}/kinUnlocks/{dateKey}"
    primaryKey: "dateKey（台北日期；同會員同日只有一筆）"
    aggregate: AGG-016
    domainModel: ["ENT-019", "VO-017"]
    api: ["API-045", "API-046", "API-040"]
    columns:
      - { name: "dateKey", type: "string", constraints: "PK" }
      - { name: "userId", type: "string", constraints: "required" }
      - { name: "kin", type: "map", constraints: "KinResult 內嵌：kinNumber(1-260), solarSeal(1-20), galacticTone(1-13)；當日 Kin 的快照" }
      - { name: "unlockedAt", type: "timestamp", constraints: "required" }
      - { name: "expiresAt", type: "timestamp", constraints: "required；= unlockedAt + 3 個月（RULE-047）" }
    indexes:
      - { fields: ["expiresAt ASC"], scope: "COLLECTION_GROUP", purpose: "排程清除到期資料（UC-017）" }
    notes: "紀錄只表達「當日已解鎖」，每會員每日一次（RULE-039）；解鎖後查看不限次數，不另存查看次數。內容以 KIN_TODAY_{kinNumber} 查 fixedContents。生日 Kin 由 users.birthData 即時計算，不落地。"
  - id: DATA-023
    name: transitReports
    path: "users/{userId}/transitReports/{reportId}"
    primaryKey: "reportId = {transitDate}_{inputVersion 的前段}（決定性 ID：同會員、同台北日期、同本命資料版本只有一份，取代 SQL UNIQUE，RULE-045）"
    aggregate: AGG-017
    domainModel: ["ENT-020", "VO-016", "VO-013", "VO-014", "VO-015", "VO-012", "VO-008"]
    api: ["API-048", "API-049", "API-050", "API-051", "API-040"]
    columns:
      - { name: "reportId", type: "string", constraints: "PK" }
      - { name: "userId", type: "string", constraints: "required" }
      - { name: "transitDate", type: "string", constraints: "required；台北日期" }
      - { name: "transitAt", type: "timestamp", constraints: "required；固定為台北當日 00:00（UTC+8，RULE-042）" }
      - { name: "input", type: "map", constraints: "TransitAnalysisInput 內嵌：inputVersion, natalChart（十顆天體與上升的落點）, transitChart（十顆天體）, aspects；只含計算後的事實，不含原始出生時間與地點（NFR-005）" }
      - { name: "status", type: "string", constraints: "required；GENERATING|COMPLETED|FAILED" }
      - { name: "sections", type: "array<map>", constraints: "ReportSection 內嵌：title, content, evidence, evidenceKind；章節結構待定" }
      - { name: "disclaimer", type: "string", constraints: "nullable" }
      - { name: "modelName", type: "string", constraints: "nullable；完成時寫入" }
      - { name: "promptVersion", type: "string", constraints: "nullable" }
      - { name: "failureReason", type: "string", constraints: "nullable" }
      - { name: "createdAt", type: "timestamp", constraints: "required" }
      - { name: "completedAt", type: "timestamp", constraints: "nullable" }
      - { name: "expiresAt", type: "timestamp", constraints: "nullable；完成時設為 completedAt + 3 個月（RULE-047）" }
    indexes:
      - { fields: ["createdAt DESC"], scope: "COLLECTION", purpose: "報告列表" }
      - { fields: ["expiresAt ASC"], scope: "COLLECTION_GROUP", purpose: "排程清除到期報告（UC-017）" }
    notes: "獨立於 detailedReports。建立報告與扣點（reason 為 TRANSIT_REPORT，異動 ID 為 transit_{reportId}）在同一 transaction；失敗時返還點數並寫入 REFUND 異動（RULE-046）。因決定性 ID 已防止重複建立，不需要另存 idempotencyKey；API 的 Idempotency-Key 用於防止同一請求重複扣點。風險：inputVersion 若是出生資料的單純雜湊，出現在 reportId 與網址時可被暴力反推出生資料（日期、時間、城市的組合空間小），實作時應改用伺服器密鑰的 HMAC 並只取前段，需確認。"
  - id: DATA-024
    name: assessmentAttempts
    path: "users/{userId}/assessmentAttempts/{attemptId}"
    primaryKey: "attemptId（自動產生）"
    aggregate: AGG-019
    domainModel: ["ENT-022", "VO-020", "VO-021", "VO-022", "VO-023", "VO-024", "VO-025", "VO-026", "VO-027"]
    api: ["API-058", "API-059", "API-060", "API-037", "API-028", "API-029"]
    columns:
      - { name: "attemptId", type: "string", constraints: "PK" }
      - { name: "assessmentId", type: "string", constraints: "required；登錄表中的分析識別碼（enneagram、hexaco、via-strengths、riasec、emotional-intelligence、attachment-style、core-values、psychological-needs）" }
      - { name: "version", type: "string", constraints: "required；送出當下的題目版本，帶 ref 標記（自行設計、未經信度與效度驗證）" }
      - { name: "answers", type: "map", constraints: "AssessmentAnswers 內嵌：scaleAnswers[]（questionId, value 1–5）、selected[]、ranked[]；量表題只有 scaleAnswers，挑選題只有 selected 與 ranked" }
      - { name: "result", type: "map", constraints: "該分析自己的結果內嵌：維度分數（scores[]：dimension, score 0–100, level?）、九型的 mainType/wing/tiedTypes、職業興趣的 code、品格優勢的 top、依附風格的 anxiety/avoidance/quadrant、核心價值觀的 selected/top" }
      - { name: "completedAt", type: "timestamp", constraints: "required" }
      - { name: "expiresAt", type: "timestamp", constraints: "required；= completedAt + 3 個月（RULE-064）" }
    indexes:
      - { fields: ["expiresAt ASC"], scope: "COLLECTION_GROUP", purpose: "排程清除到期資料（UC-017）；須在 scripts/provision-firebase.ts 建立索引例外" }
      - { fields: ["completedAt DESC"], scope: "COLLECTION", purpose: "取得某分析最新一筆未到期結果（UC-033）與多維度分析的可選判斷（UC-046）；依 completedAt 排序，assessmentId 在記憶體內過濾，因此不需要複合索引" }
    notes: "八種自我分析共用同一個子集合，以 assessmentId 區分，避免每種分析各開一個集合與各一份到期、刪除處理（design 決定 2）。作答與結果在同一份文件，同一個交易寫入、同一期限到期（AGG-019）。訪客不寫入（RULE-065）。ENT-021 AssessmentDefinition 是程式內的登錄表，不落地。"
  - id: DATA-025
    name: bigFiveAttempts
    status: deprecated
    reason: "HEXACO 取代大五人格，整個測驗已移除（UC-045）：此子集合的資料已清除，處理程式已移除"
    path: "users/{userId}/bigFiveAttempts/{attemptId}"
    primaryKey: "attemptId（自動產生）"
    aggregate: AGG-020
    domainModel: ["ENT-023"]
    api: []
    columns:
      - { name: "attemptId", type: "string", constraints: "PK" }
      - { name: "version", type: "string", constraints: "required" }
      - { name: "answers", type: "array<map>", constraints: "questionId, value 1–5" }
      - { name: "scores", type: "map", constraints: "五個特質的分數 0–100" }
      - { name: "completedAt", type: "timestamp", constraints: "required" }
      - { name: "expiresAt", type: "timestamp", constraints: "required；= completedAt + 3 個月" }
    indexes:
      - { fields: ["expiresAt ASC"], scope: "COLLECTION_GROUP", purpose: "已隨大五人格移除" }
    notes: "已移除（RULE-072、RULE-073）：2026-11-04 清除所有使用者的資料，並移除到期清除、刪帳號與索引例外的處理。"
  - id: DATA-026
    name: reportSnapshots
    path: "users/{userId}/reportSnapshots/{snapshotId}"
    primaryKey: "snapshotId（自動產生）"
    aggregate: AGG-021
    domainModel: ["ENT-024", "VO-028", "VO-029", "VO-030", "VO-031", "VO-032", "VO-033"]
    api: ["API-053", "API-054", "API-055", "API-063", "API-061", "API-028", "API-029", "API-037"]
    columns:
      - { name: "snapshotId", type: "string", constraints: "PK" }
      - { name: "kind", type: "string", constraints: "required；SINGLE（單維度）；MULTI（多維度）為舊資料，不再新增（規則組裝的跨系統報告不再保存）" }
      - { name: "systems", type: "array<string>", constraints: "required；單維度為 1 個、多維度至少 2 個系統；多維度現含 7 個既有系統，自我分析納入後含 8 個自我分析（FR-072）" }
      - { name: "position", type: "string", constraints: "required；位置結論" }
      - { name: "blocks", type: "array<map>", constraints: "報告區塊（key, title, segments[]）；偉人卡片不存入，回應時才附加" }
      - { name: "versions", type: "map", constraints: "本體、映射、片段與模板版本" }
      - { name: "basis", type: "array<map>", constraints: "分析依據" }
      - { name: "ai", type: "map", constraints: "已廢止（舊資料）：不再寫入、不遷移，隨快照到期；AI 報告見 DATA-027" }
      - { name: "aiJob", type: "map", constraints: "已廢止（舊資料）：不再寫入、不遷移，隨快照到期；AI 報告自帶 status 與 failureReason（DATA-027）" }
      - { name: "generatedAt", type: "timestamp", constraints: "required" }
      - { name: "downloadCount", type: "int", constraints: "規劃中（尚未實作）；預設 0；PDF 每次下載 +1（UC-021）" }
      - { name: "lastDownloadedAt", type: "timestamp", constraints: "規劃中（尚未實作）；nullable；供重複下載時提醒上次下載時間" }
      - { name: "expiresAt", type: "timestamp", constraints: "required；= generatedAt + 6 個月，由每日到期作業清除（不用 TTL）" }
    indexes:
      - { fields: ["expiresAt ASC"], scope: "COLLECTION_GROUP", purpose: "排程清除到期資料（UC-017）" }
    notes: "報告的實際落地集合，取代 summaries 與 detailedReports（DATA-007、DATA-008）。領域概念為 ReportSnapshot（ENT-024，AGG-021）；本體、映射與片段（ENT-025 至 ENT-027）是程式內的固定定義，不落地。AI 結果不再寫入這裡，改存 aiReports（DATA-027）；建立 AI 報告時每個系統的單維度報告各存（或重用）一份。"

  - id: DATA-027
    name: aiReports
    path: "users/{userId}/aiReports/{id}"
    primaryKey: "id（文件 id，即請求的 Idempotency-Key）"
    aggregate: AGG-025
    domainModel: ["ENT-028", "VO-037", "VO-038", "VO-028", "VO-029", "VO-039"]
    api: ["API-063", "API-064", "API-065"]
    columns:
      - { name: "id", type: "string", constraints: "PK；即 Idempotency-Key（8 到 64 個英數、- 或 _），重複請求命中同一份" }
      - { name: "sources", type: "array<map>", constraints: "required；至少一筆；每筆 { system, snapshotId, position }；snapshotId 是對 reportSnapshots 的弱參照，來源被清除時不影響閱讀" }
      - { name: "question", type: "string", constraints: "nullable；使用者的提問，前後空白去除、100 字（以字元計）內；沒提問為 null" }
      - { name: "status", type: "string", constraints: "required；GENERATING | COMPLETED | FAILED" }
      - { name: "failureReason", type: "string", constraints: "nullable；失敗原因（點數已退）；生成中而逾時為 STALE" }
      - { name: "blocks", type: "array<map>", constraints: "報告區塊（key, title, segments[]，沿用快照的結構）；完成前只有事實攤開塊（facts:{system}，每份來源一塊，標題為位置結論、一句摘要）；完成後附加導師各段（ai:highlights、ai:positives、ai:negatives、ai:past、ai:present、ai:future、ai:question（有提問才有）、ai:conclusion），每段第一句是開頭、其後是條列重點" }
      - { name: "cost", type: "int", constraints: "required；實際扣的點數（一個系統 1 點，多個依組合計價）" }
      - { name: "modelName", type: "string", constraints: "nullable；完成前為 null" }
      - { name: "promptVersion", type: "string", constraints: "nullable；完成前為 null" }
      - { name: "createdAt", type: "timestamp", constraints: "required；epoch 毫秒；列表依此降序、最多 100 筆" }
      - { name: "expiresAt", type: "timestamp", constraints: "required；epoch 毫秒；= createdAt + 6 個月，由每日到期作業清除（不用 TTL）" }
    indexes:
      - { fields: ["expiresAt ASC"], scope: "COLLECTION_GROUP", purpose: "排程清除到期資料（UC-052）；單欄位索引豁免已由 provision-firebase.ts 與 firestore.indexes.json 建立" }
      - { fields: ["createdAt DESC"], scope: "COLLECTION", purpose: "分析紀錄列表（UC-055）；單欄位排序，不需另建複合索引" }
    notes: "領域概念為 AiReport（ENT-028，AGG-025）：來源、提問、狀態、內容與扣點同一個聚合；建立時文件與扣點在同一交易寫入，完成與失敗（含退點）各在一個交易內更新，只退一次。取代 reportSnapshots 的 ai、aiJob 欄位；舊資料不遷移。刪帳號與刪除「報告」範圍時連同 reportSnapshots 一併清除（RULE-100）。"


