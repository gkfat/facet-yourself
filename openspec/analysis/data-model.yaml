    aggregate: AGG-002
    domainModel: ["ENT-002", "VO-001", "VO-002", "VO-003"]
    api: ["API-004", "API-005", "API-011", "API-013", "API-006", "API-027"]
    ttl: { field: "expiresAt", duration: "1 day", rule: "RULE-016" }
    columns:
      - { name: "sessionId", type: "string", constraints: "PK" }
      - { name: "tempProfile", type: "map", constraints: "nullable；暫存的生日、星座、血型、MBTI" }
      - { name: "tempResults", type: "map", constraints: "nullable；暫存的測驗結果（MBTI 型別、testVersion、可含作答）與人類圖結果" }
      - { name: "createdAt", type: "timestamp", constraints: "required" }
      - { name: "expiresAt", type: "timestamp", constraints: "required；= createdAt + 1 天；Firestore TTL 欄位" }
    notes: "不與任何 userId 關聯；claim 成功後立即刪除該文件。"
  - id: DATA-003
    name: tests
    path: "tests/{testId}"
