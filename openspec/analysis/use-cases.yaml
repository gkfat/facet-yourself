    mainFlow:
      - { step: 1, action: "使用者在即時星象頁選擇生成報告" }
      - { step: 2, action: "後端以本命資料版本與台北日期檢查是否已有當日報告；已有則回傳既有報告且不扣點（見 UC-028）", constraints: ["NFR-017"] }
      - { step: 3, action: "後端驗證請求者與點數，並檢查生成頻率限制", constraints: ["NFR-003", "NFR-008"] }
      - { step: 4, action: "後端以交易原子扣點並建立「生成中」的報告紀錄", constraints: ["NFR-017"] }
      - { step: 5, action: "後端計算本命盤與台北當日 00:00 的行運盤（十顆天體）及兩者相位", constraints: ["NFR-022"] }
      - { step: 6, action: "後端將正規化資料送交 AI 供應商生成報告，區分資料依據與推測", constraints: ["NFR-009", "NFR-020"] }
      - { step: 7, action: "後端驗證品質後保存報告（模型、提示詞版本、輸入版本、計算時刻、完成時間），保存 3 個月，並記錄 AI 用量", constraints: ["NFR-005", "NFR-015"] }
      - { step: 8, action: "系統顯示報告，並標明以當日 00:00（UTC+8）的星象為準，以及免責說明", constraints: ["NFR-020"] }
    alternateFlows:
      - { condition: "未提供出生時間或城市", handling: "引導至填寫，不扣點" }
      - { condition: "點數不足或已過期", handling: "拒絕並引導購買點數" }
      - { condition: "訪客", handling: "要求先登入" }
      - { condition: "重複點擊或並行請求", handling: "只扣一次點、只生成一份", constraints: ["NFR-017"] }
      - { condition: "同日、本命資料已變更", handling: "視為新的一份，依一般流程扣點" }
      - { condition: "AI 逾時、失敗或品質檢查不通過", handling: "標示失敗並返還已扣點，回報明確錯誤", constraints: ["NFR-009", "NFR-011"] }
      - { condition: "超過生成頻率限制", handling: "拒絕並提示稍後再試" }
    postconditions:
      - "成功：已扣點、報告已保存 3 個月；失敗：點數已返還，無有效報告"
    note: "點數價格待量測 AI 成本後決定（CTX-CON-017）；報告集合獨立於詳細分析"

