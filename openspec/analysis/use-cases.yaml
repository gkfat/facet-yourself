      - "已向使用者說明並取得刪除正式資料的確認"
    mainFlow:
      - { step: 1, action: "關閉大五人格的入口旗標，確認首頁與 /self-reports 的卡片消失" }
      - { step: 2, action: "以腳本 dry-run 列出所有使用者的 bigFiveAttempts 筆數與 Firestore 的 BIGFIVE 文件，經使用者確認後刪除", constraints: ["NFR-027"] }
      - { step: 3, action: "移除程式：頁面、API 與路由規則、service 與 repository 與 schema 與常數與計分工具、useExploration 與入口卡片的大五處理", constraints: ["NFR-027"] }
      - { step: 4, action: "移除 BIGFIVE 的內容類型與金鑰、content/fixed/big-five.json，更新覆蓋預期總數與相關測試", constraints: ["NFR-027"] }
      - { step: 5, action: "移除到期清除、刪帳號與索引例外中的 bigFiveAttempts 處理，並更新 api.yaml", constraints: ["NFR-027"] }
      - { step: 6, action: "以 REMOVED 需求移除主 spec big-five-test，執行 lint、測試、建置與覆蓋檢查" }
    alternateFlows:
      - { condition: "使用者尚未確認刪除正式資料", handling: "停在步驟 1，保留資料與程式" }
      - { condition: "先移除了程式才發現還有 bigFiveAttempts", handling: "補寫一次性清除腳本再執行，不恢復處理程式" }
      - { condition: "覆蓋檢查或測試失敗", handling: "修正預期總數或殘留引用後重跑，不略過" }
    postconditions:
      - "產品中沒有大五人格的頁面、API、入口、內容與資料；已存結果不匯出、不遷移"

