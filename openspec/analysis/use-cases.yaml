    mainFlow:
      - { step: 1, action: "使用者從入口或網址進入該分析的測驗頁，頁面註明「題目是自行設計、沒有經過信度與效度驗證、不是任何既有量表」" }
      - { step: 2, action: "使用者分頁作答，頁面顯示進度並區分已作答與未作答，作答暫存於 sessionStorage" }
      - { step: 3, action: "全部作答後使用者送出；未答完時送出不可用" }
      - { step: 4, action: "後端驗證作答（每題一次、值在範圍內、無未知題）", constraints: ["NFR-001"] }
      - { step: 5, action: "後端以該分析的純函式計分，同樣作答得到同樣結果，不呼叫 AI", constraints: ["NFR-024"] }
      - { step: 6, action: "後端讀取結果對應的已發佈固定內容，先確認可交付再保存", constraints: ["NFR-025"] }
      - { step: 7, action: "已登入者：系統新增一筆 assessmentAttempts 紀錄，保存 3 個月；訪客：不寫入任何文件", constraints: ["NFR-026"] }
      - { step: 8, action: "系統回傳結果，使用者進入結果頁，頁面固定顯示「怎麼看這份結果」說明、免責聲明與自行設計的註明" }
    alternateFlows:
      - { condition: "識別碼不在登錄表中", handling: "回傳 404，不寫入任何文件", constraints: ["NFR-001"] }
      - { condition: "作答缺題、重複、值越界或含未知題", handling: "回傳 400 並指出有問題的題目，不保存任何結果", constraints: ["NFR-001"] }
      - { condition: "結果需要的固定內容尚未發佈", handling: "回傳 404，不保存任何結果" }
      - { condition: "保存失敗", handling: "結果仍顯示，並提示可稍後重試儲存" }
      - { condition: "作答到一半重新整理", handling: "已作答的內容由 sessionStorage 還原，從尚未作答的第一頁繼續" }
    postconditions:
      - "已登入者新增一筆未到期的紀錄；訪客沒有任何伺服器端紀錄"
      - "使用者看到該分析的結果"

