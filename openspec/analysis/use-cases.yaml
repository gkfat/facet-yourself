  - id: UC-027
    title: "生成即時星象報告"
    actor: CTX-ACTOR-002
    requirements: ["FR-050", "FR-051", "FR-052", "FR-014", "FR-038", "FR-042", "FR-019", "FR-022", "FR-017"]
