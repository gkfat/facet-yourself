      - { step: 3, action: "使用者任選至少兩個系統，畫面顯示該組合需要的點數（基礎點數加總 × 1.2 捨去、上限 30）" }
      - { step: 4, action: "使用者確認；後端驗證組合與每個自我分析的最新未到期結果，並驗證點數餘額足夠", constraints: ["NFR-001"] }
      - { step: 5, action: "後端把每個自我分析的結果以其報告轉接轉成報告輸入，並以特質映射與其他系統放在同一套特質本體上比對", constraints: ["NFR-028"] }
      - { step: 6, action: "後端扣點，生成多維度交叉比對報告並保存，沿用既有的多維度報告規則" }
    alternateFlows:
      - { condition: "某個選取的自我分析沒有未到期結果或已在期間內到期", handling: "回傳明確錯誤並指出是哪一個分析，不扣點", constraints: ["NFR-001"] }
      - { condition: "選取的系統少於兩個，或超過可選上限", handling: "回傳驗證錯誤", constraints: ["NFR-001"] }
      - { condition: "訪客嘗試取得", handling: "拒絕並引導登入" }
      - { condition: "點數不足", handling: "引導購買點數，不生成" }
      - { condition: "AI 生成失敗", handling: "返還點數，沿用既有的失敗處理" }
    postconditions:
      - "報告已保存並可在到期前重複查看；各自我分析的原始結果不變"
    note: "映射內容待審稿（CTX-ASM-025）；最大組合的輸入長度與成本待確認（NFR-028）"

  - id: UC-047
    title: "開啟單維度報告（規則版）"
    actor: CTX-ACTOR-001
    requirements: ["FR-074", "FR-075", "FR-079", "FR-084"]
    stories: ["STORY-047"]
    preconditions:
      - "使用者選擇星座、血型、生命靈數、MBTI、瑪雅 Kin、八字或人類圖其中一個系統"
      - "該系統需要的資料已有（缺少時見替代流程）"
    mainFlow:
      - { step: 1, action: "使用者開啟該系統的報告" }
      - { step: 2, action: "系統以規則與預寫片段組裝報告：位置結論、事實與解讀、本系統的歸納、影響面向推測、建議與反思、依據與限制，不呼叫 AI、不扣點", constraints: ["NFR-029"] }
      - { step: 3, action: "每個歸納面向都引用系統事實中的具體項目；有片段的影響面向格子才顯示，過去格子為假設並附確認問題" }
      - { step: 4, action: "事實附計算依據（系統、方法、規則版本、輸入），報告顯示系統性質標籤與時間性內容的來源標示" }
      - { step: 5, action: "已登入者：報告以當時全文寫入快照（相同的基本報告只保存一份）；訪客：照常顯示但不寫入", constraints: ["NFR-030"] }
      - { step: 6, action: "系統回傳報告並在最後附偉人卡片（不屬於快照內容）" }
    alternateFlows:
      - { condition: "缺少必要資料（例如出生時間、血型、MBTI）", handling: "該區塊標示缺少並顯示補填提示，不使用預設或猜測值" }
      - { condition: "某推論找不到系統事實支持", handling: "該推論不產生" }
      - { condition: "某影響面向格子沒有片段", handling: "該格不顯示，也不以其他組合代替" }
      - { condition: "快照寫入失敗", handling: "報告仍顯示，不影響閱讀" }
    postconditions:
      - "已登入者新增或重用一份快照；訪客沒有快照"

  - id: UC-048
    title: "開啟狀態系統的精簡報告"
    actor: CTX-ACTOR-001
    requirements: ["FR-076"]
    stories: ["STORY-048"]
    preconditions:
      - "使用者已登入"
      - "塔羅或盧恩：當天已抽；星座運勢：已有星座"
    mainFlow:
      - { step: 1, action: "使用者開啟塔羅、盧恩或星座運勢的報告" }
      - { step: 2, action: "系統只組裝位置結論、事實與解讀、建議與反思、依據與限制，不含歸納與影響面向推測" }
      - { step: 3, action: "系統回傳報告，不寫入快照（避免每日報告擠掉有上限的真正報告）" }
    alternateFlows:
      - { condition: "塔羅或盧恩當天尚未抽", handling: "回明確的缺少原因並引導去抽" }
      - { condition: "訪客", handling: "回登入提示，不產生報告" }
    postconditions:
      - "沒有任何快照被新增"

  - id: UC-049
    title: "取得單維度 AI 進階分析"
    actor: CTX-ACTOR-002
    requirements: ["FR-077", "FR-079", "FR-080"]
    stories: ["STORY-049"]
    preconditions:
      - "使用者已登入"
      - "該系統的單維度報告快照存在且未到期"
      - "點數至少 1 點"
    mainFlow:
      - { step: 1, action: "使用者在報告頁要求 AI 進階分析，前端帶冪等鍵" }
      - { step: 2, action: "後端驗證快照屬於本人且未到期，並驗證點數足夠", constraints: ["NFR-001"] }
      - { step: 3, action: "後端以冪等方式扣 1 點", constraints: ["NFR-030"] }
      - { step: 4, action: "後端以事實與規則找出的面向（不含自由文字）組成輸入，呼叫 AI 並做品質檢查" }
      - { step: 5, action: "輸出每段標為 AI 綜合推論並附依據，寫入快照獨立的 ai 欄位，不改動基本內容" }
      - { step: 6, action: "使用者看到報告與 AI 分析並存" }
    alternateFlows:
      - { condition: "點數不足", handling: "拒絕並引導購點，不呼叫 AI" }
      - { condition: "生成或品質檢查失敗", handling: "退回 1 點並標示失敗原因" }
      - { condition: "使用相同冪等鍵重複請求", handling: "只扣一次，回報目前狀態" }
      - { condition: "快照屬於他人、不存在或已到期", handling: "回傳找不到，不寫入" }
    postconditions:
      - "快照的 ai 欄位已更新；再次分析只替換 ai"

  - id: UC-050
    title: "取得多維度報告"
    actor: CTX-ACTOR-002
    requirements: ["FR-078", "FR-079", "FR-080"]
    stories: ["STORY-050"]
    preconditions:
      - "使用者已登入"
      - "至少選擇兩個穩定特質系統"
      - "點數足夠"
    mainFlow:
      - { step: 1, action: "使用者選擇至少兩個系統並確認，請求帶 Idempotency-Key" }
      - { step: 2, action: "後端驗證系統數、每個系統需要的資料與點數餘額；缺資料回 422 且不扣點", constraints: ["NFR-001"] }
      - { step: 3, action: "後端以規則把各系統放進同一套特質本體並組裝報告；規則找不到任何洞見回 422（NO_INSIGHTS）且不扣點", constraints: ["NFR-029"] }
      - { step: 4, action: "後端扣點（各系統基本價之和 × 1.2 捨去、上限 30）並保存快照，回 202 與快照 id", constraints: ["NFR-030"] }
      - { step: 5, action: "AI 針對這個人改寫洞見，結果寫入快照的 ai 欄位；前端輪詢快照的 aiJob 與 ai" }
      - { step: 6, action: "使用者看到多維度報告與 AI 解讀" }
    alternateFlows:
      - { condition: "訪客嘗試取得", handling: "拒絕並引導登入" }
      - { condition: "點數不足", handling: "回 402 並引導購點，不生成" }
      - { condition: "AI 生成失敗", handling: "退點並標示失敗原因，規則版報告仍保留" }
      - { condition: "相同 Idempotency-Key 重複請求", handling: "只回報目前狀態，不重複扣點" }
      - { condition: "選取的系統少於兩個或含不支援的系統", handling: "回 400" }
    postconditions:
      - "快照已保存且含 AI 分析（或失敗標示）"
    note: "自我分析納入可選系統見 UC-046"

  - id: UC-051
    title: "查看與重複讀取我的報告快照"
    actor: CTX-ACTOR-001
    requirements: ["FR-079", "FR-080"]
    stories: ["STORY-051"]
    preconditions:
      - "使用者已登入"
    mainFlow:
      - { step: 1, action: "使用者開啟報告列表，系統回傳本人未到期的快照（依產生時間新到舊）" }
      - { step: 2, action: "使用者選擇一份，系統回傳當時的全文、版本、依據與 ai 欄位；時間性內容不隨時間更新" }
      - { step: 3, action: "讀取不呼叫 AI、不扣點、不重新計算" }
    alternateFlows:
      - { condition: "快照屬於他人或不存在", handling: "回傳找不到，不洩漏存在與否", constraints: ["NFR-003"] }
      - { condition: "快照已到期", handling: "視為不存在" }
    postconditions:
      - "快照內容不變"

  - id: UC-052
    title: "清除報告快照"
    actor: CTX-ACTOR-004
    requirements: ["FR-080"]
    stories: ["STORY-052"]
    preconditions:
      - "有到期的快照，或使用者刪除帳號或選擇刪除「報告」範圍，或使用者的快照數超過上限"
    mainFlow:
      - { step: 1, action: "每日到期作業掃描並清除超過 6 個月的快照，不對此集合開 TTL" }
      - { step: 2, action: "使用者刪除帳號時，全部快照隨帳號一併清除；刪除資料的「報告」範圍清除全部快照，其他範圍不動快照" }
      - { step: 3, action: "新增快照使總數超過上限時，先刪最舊的一份再保存" }
    alternateFlows:
      - { condition: "清除作業的某一步失敗", handling: "回報失敗的步驟，下次執行再試，不影響其他步驟" }
      - { condition: "刪除他人的快照", handling: "不會發生：刪除僅限該使用者的子集合" }
    postconditions:
      - "到期、刪除或超過上限的快照已不存在，其他使用者的快照不受影響"

  - id: UC-053
    title: "檢查特質本體、映射與情境片段"
    actor: CTX-ACTOR-003
    requirements: ["FR-081", "FR-082", "FR-083"]
    stories: ["STORY-053"]
    preconditions:
      - "本體、映射與片段的內容已修改或新增"
    mainFlow:
      - { step: 1, action: "維護者執行檢查：本體的 28 軸與情境軸結構、ID 唯一" }
      - { step: 2, action: "檢查每個系統的映射條目：原語彙真實存在、端點存在、不帶強度、狀態系統不混入", constraints: ["NFR-029"] }
      - { step: 3, action: "檢查覆蓋率不低於 80%，每個端點有來源或在已確認無來源清單，清單不過期", constraints: ["NFR-029"] }
      - { step: 4, action: "檢查情境片段的覆蓋與時間片段措辭規則；內容改動時提高對應的版本常數" }
    alternateFlows:
      - { condition: "映射引用不存在的端點或原語彙", handling: "檢查失敗並指出該條目" }
      - { condition: "覆蓋率低於下限", handling: "檢查失敗並列出未映射的關鍵字" }
      - { condition: "改了內容但沒提高版本", handling: "檢查失敗" }
    postconditions:
      - "通過檢查後版本常數與內容一致"
