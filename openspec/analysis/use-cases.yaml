      - { step: 1, action: "使用者在報告頁選擇下載 PDF，前端帶冪等鍵" }
      - { step: 2, action: "後端驗證請求者為快照擁有者", constraints: ["NFR-003"] }
      - { step: 3, action: "後端檢查此快照是否曾下載；若曾下載，系統提醒並顯示上次下載時間，須使用者確認才繼續" }
      - { step: 4, action: "後端驗證未過期點數並原子扣 1 點", constraints: ["NFR-017"] }
      - { step: 5, action: "後端讀取已保存的快照（含已有的 AI 分析）產生 PDF，MUST NOT 重新呼叫 AI" }
      - { step: 6, action: "系統回傳 PDF 讓使用者下載，並記錄下載次數與時間" }
    alternateFlows:
      - { condition: "非擁有者請求", handling: "拒絕存取", constraints: ["NFR-003"] }
      - { condition: "點數不足或已過期", handling: "拒絕並引導購買點數" }
      - { condition: "快照已到期刪除或不存在", handling: "回傳不存在訊息" }
      - { condition: "曾下載過且使用者未確認", handling: "不扣點、不產生，回到確認提示" }
      - { condition: "PDF 產生失敗", handling: "返還已扣 1 點並回報明確錯誤", constraints: ["NFR-011"] }
      - { condition: "重複送出同一請求", handling: "以冪等鍵僅處理一次", constraints: ["NFR-017"] }
    postconditions:
      - "使用者取得 PDF；已扣 1 點（失敗則返還）；該快照的下載次數 +1"
    note: "原本是詳細分析報告書寄送 email，改為直接下載（user 已確認）；每次下載扣 1 點、重複下載須確認的規則沿用原規則，未重新確認（CTX-ASM-028）；此功能尚未實作"

