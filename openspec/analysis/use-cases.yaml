      - { step: 3, action: "內容審稿，確認守則（傾向語氣、無診斷用語、不與他人比較、註明自行設計）後改為 PUBLISHED" }
      - { step: 4, action: "匯入並執行覆蓋檢查，確認所有已登錄分析的金鑰都已發佈" }
